  if (ui.reorder) html += `<div class="banner good-banner"><span>Use the arrows to rank your goals. #1 leads the home screen and goes first when money is tight.</span></div>`;
  html += `<div class="stats">${stat('Into goals', money(S.goalsM - S.goalsRetireM), 'per month')}${stat('Into IRAs & retirement goals', money(S.goalsRetireM), 'per month')}${stat('Saved so far', money(goals.reduce((t, x) => t + x.saved, 0)), 'across goals', 'good')}</div>`;
  html += `<div class="goal-grid ${ui.reorder ? 'reordering' : ''}">${goals.map((x, i) => goalCard(x, C, i, goals.length)).join('') || emptyState('No goals yet — dream a little.')}</div>`;
  if (ret.length) html += `<h2 class="sec">Retirement contributions</h2><div class="goal-grid ${ui.reorder ? 'reordering' : ''}">${ret.map((x, i) => `<div class="goal" ${ui.reorder ? '' : `data-act="editGoal" data-id="${x.g.id}" tabindex="0"`}><div class="goal-h">${rankCtl(x.g.id, i, ret.length)}<span class="g-i">${esc(x.g.icon || '🌱')}</span><div><b>${esc(x.g.name)}</b><span class="muted small">into ${esc(acctName(x.g.accountId))}${transferLabel(x)}</span></div></div><p class="big-num">${money(x.monthly)}<small>/mo · ${money(x.monthly * 12)}/yr</small></p><p class="muted small">Balance ${money(x.saved)} — see Retirement for projections.</p></div>`).join('')}</div>`;
  return html;
}
function rankCtl(id, i, n) {
  if (!ui.reorder) return `<span class="rank" title="Priority ${i + 1}">#${i + 1}</span>`;
  return `<span class="rank-ctl"><button class="icon-btn" data-act="goalMove" data-id="${id}" data-dir="-1" ${i === 0 ? 'disabled' : ''} aria-label="Move up">▲</button><b>#${i + 1}</b><button class="icon-btn" data-act="goalMove" data-id="${id}" data-dir="1" ${i === n - 1 ? 'disabled' : ''} aria-label="Move down">▼</button></span>`;
}
function transferLabel(x) {
  const g = x.g;
  if (g.contribWhen === 'yearly' && g.contribDate) return ' · yearly on ' + new Date(g.contribDate + 'T00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  if (num(g.contribDay) > 0) return ' · moves on the ' + ordinal(num(g.contribDay));
  return '';
}
const ordinal = n => n + (['th', 'st', 'nd', 'rd'][(n % 10 > 3 || [11, 12, 13].includes(n % 100)) ? 0 : n % 10]);
function moveGoal(id, dir) {
  const arr = D.goals; const i = arr.findIndex(g => g.id === id); if (i < 0) return;
  const isRet = g => { const a = D.accounts.find(x => x.id === g.accountId); return !!(a && isRetireType(a.type)); };
  const group = isRet(arr[i]);
  let j = i + dir;
  while (j >= 0 && j < arr.length && isRet(arr[j]) !== group) j += dir;
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
}
function goalCard(x, C, rank, total) {
  const g = x.g;
  let status = '', proj = '';
  if (x.target) {
    if (x.pct >= 1) status = '<span class="tag good">Reached! 🎉</span>';
    else if (g.kind === 'target' && g.targetDate) status = `<span class="tag">by ${new Date(g.targetDate + 'T00:00').toLocaleDateString('en-US', { month: 'short', year: 'numeric' })}</span>`;
    else if (x.monthly <= 0) status = '<span class="tag warn">Not funded yet</span>';
    if (x.eta != null && x.eta > 0) {
      proj = `At this pace: <b>${dateIn(x.eta)}</b> (${durLabel(x.eta)})`;
      if (num(g.apy) > 0 && x.etaNoGrowth != null && x.etaNoGrowth - x.eta >= 1) proj += ` — interest saves you ${durLabel(x.etaNoGrowth - x.eta)}`;
      else if (!num(g.apy) && x.monthly > 0) { const e4 = monthsToTarget(x.saved, x.monthly, x.target, 4); if (x.eta - e4 >= 1) proj += `. In a 4% high-yield account: ${durLabel(x.eta - e4)} sooner.`; }
    }
  }
  const ms = [25, 50, 75, 100].map(m => `<span class="ms ${x.pct != null && x.pct * 100 >= m ? 'hit' : ''}" style="left:${m}%"></span>`).join('');
  return `<div class="goal" ${ui.reorder ? '' : `data-act="editGoal" data-id="${g.id}" tabindex="0"`}>
    <div class="goal-h">${rankCtl(g.id, rank, total)}<span class="g-i">${esc(g.icon || '⭐')}</span><div><b>${esc(g.name)}</b><span class="muted small">${esc(acctName(g.accountId) || '')}${transferLabel(x)}</span></div>${status}</div>
    ${x.target ? `<div class="g-amt"><b>${money(x.saved)}</b><span>of ${money(x.target)}</span><span class="g-pct">${pct(x.pct || 0)}</span></div><div class="bar big"><span style="width:${((x.pct || 0) * 100).toFixed(1)}%"></span>${ms}</div>` : `<div class="g-amt"><b>${money(x.saved)}</b><span>saved · ongoing</span></div>`}
    <div class="g-f"><span><b>${money(x.monthly)}</b>/mo</span>${g.targetSource === 'emergency' ? `<span class="muted small">${num(g.emMonths)} months of bills + giving</span>` : ''}${g.targetSource === 'home' ? `<span class="muted small">${num(g.downPct)}% of ${money(num(g.homePrice))}</span>` : ''}</div>
    ${proj ? `<p class="small">${proj}</p>` : ''}</div>`;
}

/* ---------- RETIREMENT ---------- */
function viewRetire() {
  const C = COLORS(); const st = D.settings;
  const rows = retirementPlan(D, S);
  let html = `<div class="page-h"><div><h1>Retirement</h1><p class="muted">Where today's contributions could land us.</p></div></div>`;
  const missingAge = D.people.filter(p => !p.age);
  if (missingAge.length) html += `<div class="banner"><span>Add ${missingAge.map(p => esc(p.name)).join(' & ')}'s age for accurate projections (using ${st.defaultYears} years until then).</span>${missingAge.map(p => `<label class="inline-age">${esc(p.name)} <input type="number" inputmode="numeric" data-bind="age" data-id="${p.id}" placeholder="age"></label>`).join('')}</div>`;
  if (!rows.length) return html + card('', emptyState('Add a 401(k), 403(b), or IRA in Accounts to see projections.', '<a class="btn primary" href="#/accounts">Go to Accounts</a>'));

  const horizon = Math.max(...rows.map(r => r.years));
  const yrNow = new Date().getFullYear();
  const mid = projectSeries(rows, st.returnMid, horizon, ui.extra, st.inflation, ui.todays);
  const end = mid[mid.length - 1];
  const totalMonthly = rows.reduce((t, r) => t + r.monthly, 0);
  const totalBal = rows.reduce((t, r) => t + num(r.a.balance), 0);

  html += `<div class="stats">${stat('In retirement accounts now', money(totalBal))}${stat('Going in each month', money(totalMonthly + ui.extra), 'paychecks + match + IRAs')}${stat(`Projected in ${horizon} yrs`, moneyShort(end), ui.todays ? "in today's dollars" : 'future dollars', 'good')}${stat('Could pay us', money(end * 0.04 / 12), 'per month (4% rule)', 'accent')}</div>`;

  html += card('Projection', `<div class="controls">
      <label class="slider wide"><span>What if we add an extra <b id="extraLbl">${money(ui.extra)}</b>/month?</span><input type="range" min="0" max="2000" step="50" value="${ui.extra}" data-x="extra" aria-label="Extra monthly contribution"></label>
      <label class="check inline"><input type="checkbox" data-x="todays" ${ui.todays ? 'checked' : ''}><span>Show in today's dollars (after ${st.inflation}% inflation)</span></label>
    </div><div id="projDyn">${projDyn(rows, horizon)}</div>
    <p class="muted small">A projection, not a promise — markets don't move in straight lines. Change the return assumptions in Settings.</p>`, { cls: 'wide' });

  html += card('By account', `<div class="tbl-scroll"><table class="tbl"><thead><tr><th>Account</th><th class="r">Balance</th><th class="r">From pay</th><th class="r">Match</th><th class="r">IRA / goals</th><th class="r">At retirement</th></tr></thead><tbody>
    ${rows.map(r => { const v = fv(num(r.a.balance), r.monthly, st.returnMid, r.years * 12) / (ui.todays ? Math.pow(1 + st.inflation / 100, r.years) : 1); return `<tr><td><b>${esc(r.a.name)}</b><br><span class="muted small">${ACCOUNT_TYPES[r.a.type].label} · ${r.years} yrs${r.assumed ? ' (assumed)' : ''}</span></td><td class="r">${money(num(r.a.balance))}</td><td class="r">${money(r.fromPay)}</td><td class="r">${money(r.match)}</td><td class="r">${money(r.fromGoals)}</td><td class="r"><b>${moneyShort(v)}</b></td></tr>`; }).join('')}
  </tbody></table></div>`, { cls: 'wide' });

  // limits
  const L = st.limits; const items = [];
  S.people.forEach(r => {
    const age = num(r.p.age);
    const kLim = L.k401 + (age >= 50 ? L.k401catch : 0);
    if (r.p.retirePct > 0) items.push({ who: r.p.name, what: 'Workplace plan (401k/403b)', amt: r.retireYear, lim: kLim });
    const iraAmt = S.goals.filter(x => x.acct && isIraType(x.acct.type) && x.acct.owner === r.p.id).reduce((t, x) => t + x.monthly * 12, 0);
    if (iraAmt > 0 || D.accounts.some(a => isIraType(a.type) && a.owner === r.p.id)) items.push({ who: r.p.name, what: 'IRA', amt: iraAmt, lim: L.ira + (age >= 50 ? L.iraCatch : 0) });
  });
  html += card(`${L.year} contribution limits`, `<ul class="limits">${items.map(i => `<li><div><span><b>${esc(i.who)}</b> · ${i.what}</span><div class="bar"><span style="width:${Math.min(100, i.amt / i.lim * 100).toFixed(1)}%;${i.amt > i.lim ? 'background:var(--bad)' : ''}"></span></div></div><span class="${i.amt > i.lim ? 'bad' : ''}">${money(i.amt)} / ${money(i.lim)}${i.amt > i.lim ? ' ⚠ over' : i.amt >= i.lim - 1 ? ' ✓ maxed' : ''}</span></li>`).join('')}</ul><p class="muted small">Limits are editable in Settings — update them each January.</p>`);
  return html;
}

function projDyn(rows, horizon) {
  const C = COLORS(); const st = D.settings; const yrNow = new Date().getFullYear();
  const low = projectSeries(rows, st.returnLow, horizon, ui.extra, st.inflation, ui.todays);
  const mid = projectSeries(rows, st.returnMid, horizon, ui.extra, st.inflation, ui.todays);
  const high = projectSeries(rows, st.returnHigh, horizon, ui.extra, st.inflation, ui.todays);
  const base = ui.extra ? projectSeries(rows, st.returnMid, horizon, 0, st.inflation, ui.todays) : null;
  const end = mid[mid.length - 1];
  const series = [{ name: `Expected (${st.returnMid}%)`, values: mid, color: C.s3, endLabel: true }];
  if (base) series.push({ name: 'Without the extra', values: base, color: C.neutral, dash: true });
  return `${ui.extra ? `<p class="callout">An extra ${money(ui.extra)}/mo becomes about <b>${moneyShort(end - base[base.length - 1])}</b> more by ${yrNow + horizon}${ui.todays ? " (today's dollars)" : ''}.</p>` : ''}
    ${lineChart('proj', { series, band: { low, high, color: C.s3 }, xLabels: mid.map((_, i) => String(yrNow + i)), label: 'Retirement projection' })}
    ${legend([{ label: `Expected — ${st.returnMid}% a year`, color: C.s3, value: '' }, { label: `Shaded range — ${st.returnLow}% to ${st.returnHigh}%`, color: 'color-mix(in srgb, ' + C.s3 + ' 30%, transparent)', value: '' }, ...(base ? [{ label: 'Without the extra', color: C.neutral, value: '' }] : [])])}`;
}

  const groups = { cash: 'Cash', retire: 'Retirement', invest: 'Investments', debt: 'Owed' };

  Object.keys(groups).forEach(g => {

    html += `<h2 class="sec">${groups[g]}</h2><div class="acct-grid">${list.map(a => {
      const bills = D.bills.filter(b => b.accountId === a.id).reduce((t, b) => t + billMonthly(b), 0);
      const goals = S.goals.filter(x => x.g.accountId === a.id).reduce((t, x) => t + x.monthly, 0);

      const pay = S.people.filter(r => r.p.retireAccountId === a.id).reduce((t, r) => t + r.retireM + r.matchM, 0);
      const flows = [bills && `${money(bills)} bills out`, give && `${money(give)} ${esc(D.giving.label || 'giving').toLowerCase()} out`, goals && `${money(goals)} saved in`, pay && `${money(pay)} from paychecks`].filter(Boolean);
      return `<div class="acct" data-act="editAccount" data-id="${a.id}" tabindex="0"><div class="acct-h"><span class="tag">${ACCOUNT_TYPES[a.type].label}</span><span class="muted small">${esc(personName(D, a.owner))}</span></div>
        <b class="acct-n">${esc(a.name)}</b><span class="muted small">${esc(a.institution || '')}${a.last4 ? ' ••' + esc(a.last4) : ''}</span>
        <span class="acct-b ${g === 'debt' ? 'bad' : ''}">${g === 'debt' ? '−' : ''}${money(Math.abs(num(a.balance)))}</span>

    }).join('')}</div>`;
  });
  if (!D.accounts.length) html += card('', emptyState('Add your checking, savings, and retirement accounts.', '<button class="btn primary" data-act="addAccount">Add account</button>'));
  html += `<p class="muted small center">🔒 Only last-4 digits are stored. Balances update during each Money Date.</p>`;
  return html;
}

/* ---------- GIVING ---------- */
const PLAN_LABEL = { actual: 'her recent real paystubs', expected: 'expected pay with differentials', floor: 'base pay only (lowest it could be)', budget: 'salary' };
function payLogCard(p) {

  const log = payLogFor(D, p.id).slice().reverse();
  const pend = pendingPaydays(D, p);
  const yr = String(new Date().getFullYear());
  const ytd = log.filter(e => e.date.startsWith(yr));
  const ytdOwed = ytd.reduce((t, e) => t + titheFor(D, e), 0), ytdGiven = ytd.filter(e => e.paid).reduce((t, e) => t + titheFor(D, e), 0);
  const included = gv.personIds.includes(p.id);

      <td><a href="#" data-act="editLog" data-id="${e.id}">${fmtD(e.date)}</a></td><td class="r">${money(num(e.gross), true)}</td><td class="r muted">${num(e.net) ? money(num(e.net), true) : '—'}</td>

    : `<p class="muted">No paychecks logged yet. When a stub comes in, tap <b>Log a paycheck</b>, type the gross, and the app tells you exactly what to give.</p>`;

  return card(`${esc(p.name)}'s paycheck log`, body, { cls: 'wide' });
}

}

/* ---------- MONEY DATE (check-in) ---------- */
function viewCheckin() {
  if (!ui.draft) {
    ui.draft = { date: todayISO(), balances: {}, goals: {}, paychecks: {}, note: '' };
    D.accounts.forEach(a => ui.draft.balances[a.id] = num(a.balance));
    D.goals.forEach(g => ui.draft.goals[g.id] = num(g.saved));
    D.people.filter(p => p.payType === 'hourly').forEach(p => ui.draft.paychecks[p.id] = ['', '', '']);
    ui.step = 0;
  }
  const dr = ui.draft;
  const steps = ['Balances', 'Paychecks', 'Goals', 'Wrap up'];
  const hourly = D.people.filter(p => p.payType === 'hourly');
  let body = '';
  if (ui.step === 0) {
    body = `<p class="muted">Open your banking apps and update each balance. For cards & loans, enter what you owe.</p><div class="ci-list">${D.accounts.map(a => `<label class="ci-row"><span><b>${esc(a.name)}</b><small>${ACCOUNT_TYPES[a.type].label}${a.last4 ? ' ••' + esc(a.last4) : ''}</small></span><div class="inp pre"><i>$</i><input type="number" step="any" inputmode="decimal" data-draft="balances" data-id="${a.id}" value="${esc(dr.balances[a.id])}"></div></label>`).join('') || '<p>No accounts yet.</p>'}</div>`;
  } else if (ui.step === 1) {
    const since = new Date(); since.setDate(since.getDate() - 35); const sinceISO = since.toISOString().slice(0, 10);
    body = hourly.length ? hourly.map(p => {
      const recent = payLogFor(D, p.id).filter(e => e.date >= sinceISO);
      const pend = pendingPaydays(D, p);
      return `<h4>${esc(p.name)}'s paystubs</h4>${recent.length ? `<ul class="plain">${recent.map(e => `<li>${new Date(e.date + 'T00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}: ${money(num(e.gross), true)} gross${num(e.net) ? ' · ' + money(num(e.net), true) + ' take-home' : ''} · ${e.paid ? '✓ ' + esc((D.giving.label || 'giving').toLowerCase()) + ' given' : '<b>' + esc((D.giving.label || 'giving').toLowerCase()) + ' not given yet</b>'}</li>`).join('')}</ul>` : '<p class="muted small">Nothing logged in the last month.</p>'}
        ${pend.length ? `<p class="warn-text small">${pend.length} payday${pend.length > 1 ? 's' : ''} still need${pend.length > 1 ? '' : 's'} a stub.</p>` : ''}
        <button class="btn sm ghost" data-act="logPay" data-pid="${p.id}">+ Log a paycheck</button>`;
    }).join('') + '<p class="muted small">These paystubs feed her real-pay average and the giving tracker.</p>' : '<p class="muted">No hourly paychecks to log. Skip ahead!</p>';
  } else if (ui.step === 2) {
    const gl = D.goals.filter(g => { const a = D.accounts.find(x => x.id === g.accountId); return !(a && isRetireType(a.type)); });
    body = `<p class="muted">How much is set aside for each goal now? If a goal has its own account, use that balance.</p><div class="ci-list">${gl.map(g => { const a = D.accounts.find(x => x.id === g.accountId); const solo = a && D.goals.filter(x => x.accountId === a.id).length === 1; return `<label class="ci-row"><span><b>${esc(g.icon || '')} ${esc(g.name)}</b><small>${a ? esc(a.name) + (solo ? ' — ' + money(dr.balances[a.id]) : ' (shared)') : ''}</small></span><div class="inp pre"><i>$</i><input type="number" step="any" inputmode="decimal" data-draft="goals" data-id="${g.id}" value="${esc(dr.goals[g.id])}"></div></label>`; }).join('') || '<p>No goals yet.</p>'}</div>`;
  } else {
    const prevSnap = D.snapshots.slice().sort((a, b) => b.date.localeCompare(a.date))[0];
    const nwNow = snapshotNetWorth(D, { balances: dr.balances });
    const delta = prevSnap ? nwNow - snapshotNetWorth(D, prevSnap) : null;
    body = `<div class="wrap-up"><p class="big-num">${money(nwNow)}<small> net worth</small></p>${delta != null ? `<p class="${delta >= 0 ? 'good' : 'bad'}">${delta >= 0 ? '▲' : '▼'} ${money(Math.abs(delta))} since ${new Date(prevSnap.date + 'T00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric' })}</p>` : '<p class="muted">Your first data point. The journey starts here.</p>'}
      <label class="field"><span>Date</span><input type="date" data-draft="date" value="${dr.date}"></label>
      <label class="field"><span>A note for future us</span><textarea rows="3" data-draft="note" placeholder="Wins, surprises, what we want to change…">${esc(dr.note)}</textarea></label></div>`;
  }
  let html = `<div class="page-h"><div><h1>Money Date</h1><p class="muted">Once a month, 10 minutes, together. Grab a coffee ☕</p></div></div>`;
  html += card('', `<ol class="stepper">${steps.map((s, i) => `<li class="${i === ui.step ? 'on' : i < ui.step ? 'done' : ''}">${s}</li>`).join('')}</ol>${body}
    <div class="ci-nav">${ui.step > 0 ? '<button class="btn ghost" data-act="ciBack">Back</button>' : '<span></span>'}${ui.step < 3 ? '<button class="btn primary" data-act="ciNext">Next</button>' : '<button class="btn primary" data-act="ciSave">Save our Money Date 🎉</button>'}</div>`, { cls: 'wide' });
  const hist = D.snapshots.slice().sort((a, b) => b.date.localeCompare(a.date));
  if (hist.length) html += card('Past Money Dates', `<ul class="rows">${hist.map(sn => `<li class="row"><div class="row-m"><b>${new Date(sn.date + 'T00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</b><span class="muted small">${esc(sn.note || '')}</span></div><div class="row-v"><b>${money(snapshotNetWorth(D, sn))}</b><button class="icon-btn" data-act="delSnap" data-id="${sn.id}" aria-label="Delete">✕</button></div></li>`).join('')}</ul>`);
  return html;
}

function saveCheckin() {
  const dr = ui.draft;
  const before = summarize(D).goals.map(x => ({ id: x.g.id, pct: x.pct }));
  D.accounts.forEach(a => { if (dr.balances[a.id] !== '' && dr.balances[a.id] != null) a.balance = num(dr.balances[a.id]); });
  D.goals.forEach(g => { if (dr.goals[g.id] !== undefined && dr.goals[g.id] !== '') g.saved = num(dr.goals[g.id]); });
  const pc = {}; Object.keys(dr.paychecks).forEach(k => { const v = dr.paychecks[k].map(num).filter(x => x > 0); if (v.length) pc[k] = v; });
  D.snapshots.push({ id: uid(), date: dr.date, balances: Object.assign({}, dr.balances), goals: Object.assign({}, dr.goals), paychecks: pc, note: dr.note });
  ui.draft = null; ui.step = 0;
  S = summarize(D);
  const wins = [];
  S.goals.forEach(x => {
    if (x.pct == null) return;
    [25, 50, 75, 100].forEach(m => { if (x.pct * 100 >= m && !x.g.celebrated.includes(m)) { x.g.celebrated.push(m); wins.push(`${x.g.name} hit ${m}%!`); } });
  });
  save();
  location.hash = '#/home';
  setTimeout(() => { confetti(); toast(wins.length ? '🎉 ' + wins.join(' ') : 'Money Date saved. Proud of you two!', 'good'); }, 150);
}

function setPath(obj, path, val) { const ks = path.split('.'); let o = obj; ks.slice(0, -1).forEach(k => o = o[k]); o[ks[ks.length - 1]] = val; }
function getPath(obj, path) { return path.split('.').reduce((o, k) => o && o[k], obj); }

/* ---------- backup / restore ---------- */
function download(name, text) {
  const blob = new Blob([text], { type: 'application/json' });
  const file = typeof File === 'function' ? new File([blob], name, { type: 'application/json' }) : null;
  if (file && navigator.canShare && navigator.canShare({ files: [file] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) {
    navigator.share({ files: [file], title: name }).catch(() => plainDownload(blob, name));
  } else plainDownload(blob, name);
}
function plainDownload(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }

function doBackup() {
  const canCrypto = !!(window.crypto && crypto.subtle);
  openForm({
    title: 'Save a backup', value: { pass: '', pass2: '' }, saveLabel: 'Save backup file',
    intro: 'Creates one file with everything. Keep it somewhere safe. ' + (canCrypto ? 'Add a password to encrypt it (recommended if you store it in the cloud) — don\'t forget it, it can\'t be recovered.' : ''),
    fields: canCrypto ? [{ k: 'pass', label: 'Password (optional)', type: 'password' }, { k: 'pass2', label: 'Repeat password', type: 'password' }] : [],
    validate: v => v.pass && v.pass !== v.pass2 ? 'Passwords don\'t match' : null,
    onSave: async v => {
      D.settings.lastBackup = new Date().toISOString(); save();
      const stamp = todayISO();
      const payload = v.pass ? await encryptJSON(D, v.pass) : D;
      download(`our-nest-backup-${stamp}${v.pass ? '-locked' : ''}.json`, JSON.stringify(payload, null, 1));
      toast('Backup created'); render();
    }
  });
}
function doRestore() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = async () => {
      let obj;
      try { obj = JSON.parse(r.result); } catch (e) { return toast('That file isn\'t a valid backup', 'bad'); }
      const finish = data => {
        if (!data || !Array.isArray(data.people)) return toast('That file isn\'t an Our Nest backup', 'bad');
        D = normalize(data); S = summarize(D); save(); location.hash = '#/home'; render(); toast('Loaded! Welcome home 🪺', 'good');
      };
      if (obj.ournestEncrypted) {
        openForm({ title: 'This backup is locked', value: { pass: '' }, fields: [{ k: 'pass', label: 'Password', type: 'password' }], saveLabel: 'Unlock',
          onSave: async v => { try { finish(await decryptJSON(obj, v.pass)); } catch (e) { toast('Wrong password', 'bad'); } } });
      } else if (D && D.people.length) {
        openForm({ title: 'Replace everything?', value: {}, intro: 'This replaces all data on this device with the file you picked.', fields: [], saveLabel: 'Yes, replace', onSave: () => finish(obj) });
      } else finish(obj);
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ---------- PIN lock ---------- */
function showLock() {
  const app = $('#app');
  app.innerHTML = `<div class="welcome"><div class="welcome-card"><div class="logo-big">🔒</div><h1>${esc(D.appName)}</h1><input id="pin" class="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" aria-label="PIN"><button class="btn primary big" id="unlock">Unlock</button></div></div>`;
  const go = async () => { if (await sha256('ournest:' + $('#pin').value) === D.settings.pinHash) { unlocked = true; render(); } else { $('#pin').value = ''; toast('Wrong PIN', 'bad'); } };
  $('#unlock').onclick = go; $('#pin').onkeydown = e => { if (e.key === 'Enter') go(); }; $('#pin').focus();
}
let unlocked = false;

/* ---------- boot ---------- */
function onRoute() {
  const r = (location.hash.match(/#\/(\w+)/) || [])[1] || 'home';
  if (r !== route) { route = r; ui.more = false; ui.explore = {}; window.scrollTo(0, 0); }
  if (D && D.settings.pinHash && !unlocked) return showLock();
  render();
}

function wireApp() {
  document.addEventListener('click', e => {
    const go = e.target.closest('[data-go]'); if (go) { location.hash = '#/' + go.dataset.go; return; }
    const el = e.target.closest('[data-act]'); if (!el || el.closest('#modal')) return;
    if (el.classList.contains('more-sheet') && e.target !== el) return;
    const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.matches('[data-act][tabindex]')) { const fn = ACT[e.target.dataset.act]; if (fn) fn(e.target); }
  });
  // inline-bound inputs (settings, giving, ages)
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.closest('#modal')) return;
    if (el.dataset.quick) {
      const v = el.value; if (!v) return;
      if (el.dataset.quick === 'payday') { const p = D.people.find(x => x.id === el.dataset.id); if (p) p.lastPayday = v; }
      if (el.dataset.quick === 'billDay') { const b = D.bills.find(x => x.id === el.dataset.id); const n = Math.round(num(v)); if (b && n >= 1 && n <= 31) b.dueDay = n; else return toast('Use a day from 1 to 31', 'bad'); }
      if (el.dataset.quick === 'billDate') { const b = D.bills.find(x => x.id === el.dataset.id); if (b) b.dueDate = v; }
      if (el.dataset.quick === 'goalDay') { const g = D.goals.find(x => x.id === el.dataset.id); const n = Math.round(num(v)); if (g && n >= 1 && n <= 31) { g.contribDay = n; g.contribWhen = g.contribWhen || 'monthly'; } else return toast('Use a day from 1 to 31', 'bad'); }
      ui.keepScroll = true; commit(); toast('Added to the calendar'); return;
    }
    if (el.dataset.bind === 'age') { const p = D.people.find(x => x.id === el.dataset.id); if (p) { p.age = num(el.value) || null; commit(); } return; }
    if (el.dataset.bind) {
      const path = el.dataset.bind;
      if (el.dataset.multi !== undefined) { const arr = new Set(getPath(D, path) || []); el.checked ? arr.add(el.dataset.multi) : arr.delete(el.dataset.multi); setPath(D, path, [...arr]); }
      else if (el.type === 'checkbox') setPath(D, path, el.checked);
      else setPath(D, path, el.dataset.num ? num(el.value) : el.value);
      ui.keepScroll = true; commit(); return;
    }
    if (el.dataset.x === 'extra') { ui.keepScroll = true; render(); return; }
    if (el.dataset.x === 'todays') { ui.todays = el.checked; ui.keepScroll = true; render(); }
    if (el.dataset.draft) { draftInput(el); }
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.draft) return draftInput(el);
    if (el.dataset.x === 'extra') {
      ui.extra = num(el.value);
      const rows = retirementPlan(D, S); const horizon = Math.max(...rows.map(r => r.years));
      $('#extraLbl').textContent = money(ui.extra); $('#projDyn').innerHTML = projDyn(rows, horizon);
      return;
    }
    if (el.dataset.x === 'diff' || el.dataset.x === 'ot') {
      const box = el.closest('.explorer'); const p0 = D.people.find(x => x.id === box.dataset.pid);
      const o = ui.explore[p0.id] = ui.explore[p0.id] || { diffs: p0.diffs.map(df => num(df.hours)), ot: num(p0.otHours) };
      if (el.dataset.x === 'diff') o.diffs[+el.dataset.i] = num(el.value); else o.ot = num(el.value);
      el.nextElementSibling.textContent = el.value + ' hrs';
      const p = explorePerson(p0); const ex = paycheck(p, 'expected'), fl = paycheck(p, 'floor');
      box.querySelector('[data-o="net"]').textContent = money(ex.net, true);
      box.querySelector('[data-o="diff"]').textContent = '+' + money(ex.net - fl.net, true) + ' over floor';
    }
  });
}
function draftInput(el) {
  const dr = ui.draft; const k = el.dataset.draft;
  if (k === 'date' || k === 'note') dr[k] = el.value;
  else if (k === 'paychecks') dr.paychecks[el.dataset.id][+el.dataset.i] = el.value;
  else dr[k][el.dataset.id] = el.value === '' ? '' : num(el.value);
}

function boot() {
  try { setHidden(localStorage.getItem('ournest:hide') === '1'); } catch (e) {}
  D = load();
  if (D) S = summarize(D);
  wireApp(); wireModal(); initTooltips();
  window.addEventListener('hashchange', onRoute);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => D && render());
  onRoute();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
document.addEventListener('DOMContentLoaded', boot);

</script>
