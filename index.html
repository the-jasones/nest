<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5c45">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Our Nest">
<title>Our Nest</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  color-scheme: light;
  --bg: #f5efe4; --surface: #fffcf6; --surface-2: #f3ecdf; --line: #e6dccb;
  --ink: #1e2a24; --ink-2: #56615b; --ink-3: #6f7872;
  --brand: #1f5c45; --brand-ink: #ffffff; --brand-soft: #dcebe1;
  --accent: #b86a12; --accent-soft: #fbead2;
  --good: #1b7a50; --bad: #b8382f; --warn: #94600d;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --neutral: #b4ada0;
  --p1: #1f5c45; --p2: #5d8f72;
  --shadow: 0 1px 2px rgba(60, 45, 20, .06), 0 6px 20px rgba(60, 45, 20, .06);
  --radius: 16px;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121614; --surface: #1a201d; --surface-2: #222a26; --line: #2e3833;
    --ink: #eef1ec; --ink-2: #b8c1bb; --ink-3: #8e9891;
    --brand: #6cc79a; --brand-ink: #0b1a12; --brand-soft: #1f3529;
    --accent: #f0b35a; --accent-soft: #3a2a12;
    --good: #5fcf96; --bad: #f07a70; --warn: #e5b45a;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --neutral: #5f6660;
    --p1: #6cc79a; --p2: #3f8a64;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121614; --surface: #1a201d; --surface-2: #222a26; --line: #2e3833;
  --ink: #eef1ec; --ink-2: #b8c1bb; --ink-3: #8e9891;
  --brand: #6cc79a; --brand-ink: #0b1a12; --brand-soft: #1f3529;
  --accent: #f0b35a; --accent-soft: #3a2a12;
  --good: #5fcf96; --bad: #f07a70; --warn: #e5b45a;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --neutral: #5f6660;
  --p1: #6cc79a; --p2: #3f8a64;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 600; letter-spacing: -.01em; margin: 0; line-height: 1.2; }
h1 { font-size: 30px; } h3 { font-size: 18px; } h4 { font-size: 15px; margin: 14px 0 6px; font-family: var(--sans); }
a { color: var(--brand); }
.muted { color: var(--ink-2); } .small { font-size: 13px; } .center { text-align: center; }
.good { color: var(--good); } .bad { color: var(--bad); }
.pre { white-space: pre-wrap; }
b, .stat-v, .tbl td, .big-num, .row-v { font-variant-numeric: tabular-nums; }

/* ---------- layout ---------- */
#app { display: block; min-height: 100vh; }
.side { position: fixed; inset: 0 auto 0 0; width: 228px; background: var(--surface); border-right: 1px solid var(--line); padding: 20px 12px; display: flex; flex-direction: column; gap: 14px; z-index: 5; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 10px; font-family: var(--serif); font-size: 19px; }
.logo { font-size: 26px; }
.side nav { display: flex; flex-direction: column; gap: 2px; }
.side nav a { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 10px; color: var(--ink-2); text-decoration: none; font-weight: 500; }
.side nav a:hover { background: var(--surface-2); color: var(--ink); }
.side nav a.on { background: var(--brand-soft); color: var(--brand); }
.ni { width: 20px; text-align: center; font-size: 15px; }
.side-foot { margin-top: auto; }
main { margin-left: 228px; padding: 28px clamp(16px, 3vw, 40px) 60px; max-width: 1240px; display: grid; grid-template-columns: 1fr; gap: 18px; }
.bottom, .more-sheet { display: none; }

@media (max-width: 860px) {
  .side { display: none; }
  main { margin-left: 0; padding: 18px 16px 100px; }
  h1 { font-size: 25px; }
  .bottom { display: flex; position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 20; }
  .bottom a, .bottom button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; font: 500 11px var(--sans); color: var(--ink-2); text-decoration: none; background: none; border: 0; padding: 6px 0; border-radius: 10px; }
  .bottom .ni { font-size: 18px; }
  .bottom .on { color: var(--brand); background: var(--brand-soft); }
  .more-sheet { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 19; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .more-sheet.open { opacity: 1; pointer-events: auto; }
  .more-inner { position: absolute; left: 10px; right: 10px; bottom: calc(76px + env(safe-area-inset-bottom)); background: var(--surface); border-radius: 18px; padding: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; box-shadow: var(--shadow); }
  .more-inner a { display: flex; gap: 10px; padding: 14px; border-radius: 12px; color: var(--ink); text-decoration: none; font-weight: 500; }
  .more-inner a.on { background: var(--brand-soft); color: var(--brand); }
}

/* ---------- building blocks ---------- */
.page-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.page-h p { margin: 4px 0 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
.h-sub { font: 500 13px var(--sans); color: var(--ink-3); margin-left: 6px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 18px; }
.sec { font-size: 20px; margin-top: 8px; }
.btn { appearance: none; border: 1px solid transparent; border-radius: 999px; padding: 9px 16px; font: 600 14px var(--sans); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--ink); background: var(--surface-2); }
.btn.primary { background: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn.big { padding: 14px 20px; font-size: 16px; width: 100%; }
.btn.block { width: 100%; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.icon-btn { background: none; border: 0; color: var(--ink-3); font-size: 15px; cursor: pointer; padding: 6px 8px; border-radius: 8px; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn.danger { color: var(--bad); }
.link { font-size: 13px; font-weight: 600; text-decoration: none; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.tag { display: inline-block; font: 600 11px var(--sans); padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); margin-right: 4px; white-space: nowrap; }
.tag.warn { background: var(--accent-soft); color: var(--warn); }
.tag.good { background: var(--brand-soft); color: var(--good); }
.tag.sub { background: color-mix(in srgb, var(--s5) 18%, transparent); color: var(--ink); }
.empty { text-align: center; padding: 18px 8px; color: var(--ink-2); }
.empty p { margin: 0 0 12px; }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); padding: 12px 16px; border-radius: 14px; font-weight: 500; }
.inline-age { display: inline-flex; align-items: center; gap: 6px; } .inline-age input[type=number] { width: 80px; }
.callout { background: var(--brand-soft); border-radius: 12px; padding: 10px 14px; margin: 8px 0; }
.warn-text { color: var(--bad); font-weight: 600; }
.pill-note { display: inline-block; background: var(--surface-2); border-radius: 999px; padding: 4px 12px; font-size: 13px; margin: 0 0 8px; }

/* ---------- hero & stats ---------- */
.hero { background: linear-gradient(135deg, var(--brand) 0%, color-mix(in srgb, var(--brand) 70%, #0b2e21) 100%); color: #fff; border-radius: 22px; padding: 26px 28px; display: grid; grid-template-columns: 1.5fr 1fr; gap: 24px; align-items: center; box-shadow: var(--shadow); }
:root[data-theme="dark"] .hero { background: linear-gradient(135deg, #1d4a37, #10271d); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero { background: linear-gradient(135deg, #1d4a37, #10271d); } }
.hero h1 { font-size: clamp(24px, 3.4vw, 34px); color: #fff; }
.hero em { font-style: normal; color: #ffd690; }
.eyebrow { margin: 0 0 6px; opacity: .85; font-weight: 500; }
.hero-sub { margin: 10px 0 0; opacity: .9; }
.hero-goal { background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .18); border-radius: 16px; padding: 16px; display: flex; gap: 14px; align-items: center; }
.hero-goal > div { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.hero-goal span { font-size: 13px; opacity: .9; }
.hg-emoji { font-size: 36px; }
.hero-goal .bar { background: rgba(255, 255, 255, .2); margin-top: 6px; }
.hero-goal .bar span { background: #ffd690; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; padding: 20px; } }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; box-shadow: var(--shadow); }
.stat-l { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.stat-v { font: 600 24px var(--serif); }
.stat-s { font-size: 12px; color: var(--ink-3); }
.stat.good { border-top: 3px solid var(--good); } .stat.accent { border-top: 3px solid var(--accent); } .stat.bad { border-top: 3px solid var(--bad); }
.stat.bad .stat-v { color: var(--bad); }
.big-num { font: 600 28px var(--serif); margin: 4px 0; }
.big-num small { font: 500 13px var(--sans); color: var(--ink-2); margin-left: 6px; }

/* ---------- bars ---------- */
.bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; position: relative; }
.bar > span:first-child { display: block; height: 100%; background: var(--brand); border-radius: 999px; transition: width .6s cubic-bezier(.2, .8, .2, 1); }
.bar.big { height: 14px; overflow: visible; }
.bar.big > span:first-child { border-radius: 999px; }
.ms { position: absolute; top: -3px; width: 2px; height: 20px; background: var(--line); transform: translateX(-1px); }
.ms.hit { background: var(--brand); }
.ms:last-child { display: none; }

/* ---------- charts ---------- */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--ink-2); font: 12px var(--sans); }
.chart .axis { fill: var(--ink-3); font-size: 11px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .xhair { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; }
.flow { opacity: .5; transition: opacity .15s; }
.flow:hover { opacity: .85; }
.fl-l { fill: var(--ink) !important; font-weight: 600; font-size: 13px !important; }
.fl-v { fill: var(--ink-2) !important; font-size: 12px !important; }
.fl-mid { fill: var(--ink-3); }
.donut-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.donut { max-width: 200px; flex: 0 0 200px; }
.donut path { stroke: none; }
.donut-big { font: 600 28px var(--serif) !important; fill: var(--ink) !important; }
.donut-small { font-size: 12px; }
.legend { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 6px; }
.legend li { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.lg-l { flex: 1; } .lg-v { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.sw { width: 12px; height: 12px; border-radius: 4px; display: inline-block; flex: none; }
.tooltip .sw { width: 9px; height: 9px; margin-right: 5px; }
.tooltip { position: fixed; display: none; z-index: 100; background: var(--ink); color: var(--bg); padding: 8px 11px; border-radius: 10px; font-size: 13px; pointer-events: none; box-shadow: var(--shadow); max-width: 260px; line-height: 1.45; }
.tooltip .muted { color: color-mix(in srgb, var(--bg) 75%, transparent); }
.hbars { display: flex; flex-direction: column; gap: 8px; }
.hb-row { display: grid; grid-template-columns: minmax(90px, 140px) 1fr 70px; align-items: center; gap: 10px; font-size: 13px; }
.hb-l { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb-track { height: 12px; background: var(--surface-2); border-radius: 0 4px 4px 0; }
.hb-fill { display: block; height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
.hb-v { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.ring-track { fill: none; stroke: var(--surface-2); stroke-width: 10; }
.tbl-toggle summary { cursor: pointer; font-size: 13px; color: var(--brand); font-weight: 600; margin-top: 6px; }

/* ---------- tables & rows ---------- */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font: 600 12px var(--sans); color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl .r { text-align: right; white-space: nowrap; }
.tbl tr.tot td { font-weight: 700; border-top: 2px solid var(--ink-3); border-bottom: 0; }
.tbl tr.muted td { color: var(--ink-2); border-bottom: 0; }
.tbl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 6px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 8px; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--surface-2); }
.row-m { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row-v { display: flex; flex-direction: column; align-items: flex-end; flex: none; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 7px 14px; font: 600 13px var(--sans); cursor: pointer; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* ---------- home bits ---------- */
.mini-goals { display: flex; flex-direction: column; gap: 14px; }
.mg { display: flex; gap: 12px; align-items: center; cursor: pointer; }
.mg-i { font-size: 24px; width: 36px; height: 36px; display: grid; place-items: center; background: var(--surface-2); border-radius: 12px; flex: none; }
.mg-b { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.mg-t { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.mg-t span { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.xp { list-style: none; margin: 0 0 8px; padding: 0; }
.xp li { display: grid; grid-template-columns: 90px 1fr auto; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.reality { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; margin-top: 10px; font-size: 14px; }
.reality-line { font-size: 14px; background: var(--surface-2); padding: 8px 12px; border-radius: 10px; }

/* ---------- income ---------- */
.inc-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 22px; align-items: start; }
@media (max-width: 960px) { .inc-grid { grid-template-columns: 1fr; } }
.explorer { background: var(--surface-2); border-radius: 14px; padding: 16px; }
.explorer h4 { margin-top: 0; }
.slider { display: grid; grid-template-columns: 1fr 64px; gap: 2px 10px; align-items: center; margin: 12px 0; font-size: 14px; }
.slider > span { grid-column: 1 / -1; }
.slider.wide { grid-template-columns: 1fr; }
.slider output { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 13px; }
input[type=range] { width: 100%; accent-color: var(--brand); height: 28px; }
.ex-out { display: flex; flex-direction: column; background: var(--surface); border-radius: 12px; padding: 12px; margin: 12px 0; }
.ex-out b { font: 600 26px var(--serif); }
.ex-out span:first-child { font-size: 13px; color: var(--ink-2); }

/* ---------- goals ---------- */
.goal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.goal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); cursor: pointer; display: flex; flex-direction: column; gap: 12px; transition: transform .15s; }
.goal:hover { transform: translateY(-2px); }
.goal-h { display: flex; gap: 12px; align-items: center; }
.goal-h > div { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.g-i { font-size: 28px; width: 46px; height: 46px; display: grid; place-items: center; background: var(--surface-2); border-radius: 14px; flex: none; }
.g-amt { display: flex; align-items: baseline; gap: 8px; }
.g-amt b { font: 600 26px var(--serif); }
.g-amt span { color: var(--ink-2); font-size: 14px; }
.g-pct { margin-left: auto; font-weight: 700; color: var(--brand) !important; }
.g-f { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 14px; }
.goal p { margin: 0; }

/* ---------- retirement ---------- */
.controls { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
.limits { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.limits li { display: flex; justify-content: space-between; gap: 14px; align-items: flex-end; font-size: 14px; }
.limits li > div { flex: 1; display: flex; flex-direction: column; gap: 6px; }

/* ---------- accounts ---------- */
.acct-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 14px; }
.acct { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; box-shadow: var(--shadow); }
.acct:hover { border-color: var(--brand); }
.acct-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.acct-n { font-size: 16px; }
.acct-b { font: 600 24px var(--serif); margin-top: 6px; }
.acct p { margin: 4px 0 0; }

/* ---------- forms ---------- */
.form-inline, .form-body { display: flex; flex-wrap: wrap; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; flex: 1 1 100%; min-width: 0; border: 0; padding: 0; margin: 0; }
.field.half { flex: 1 1 calc(50% - 7px); min-width: 140px; }
.field > span, .field legend, .field .lbl { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.help { color: var(--ink-3); font-size: 12px; }
input[type=text], input[type=number], input[type=date], input[type=password], select, textarea { font: 15px var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--brand) 50%, transparent); border-color: var(--brand); }
.inp { display: flex; align-items: center; position: relative; }
.inp i { font-style: normal; color: var(--ink-3); position: absolute; font-size: 14px; pointer-events: none; }
.inp.pre i:first-child { left: 12px; } .inp.pre input { padding-left: 26px; }
.inp.post i:last-child { right: 12px; } .inp.post input { padding-right: 30px; }
.check { flex-direction: row !important; align-items: center; gap: 10px !important; cursor: pointer; }
.check > span { font-size: 14px !important; color: var(--ink) !important; font-weight: 500 !important; }
.check.inline { display: inline-flex; margin-right: 16px; }
.check input { width: 18px; height: 18px; accent-color: var(--brand); }
.field.list { gap: 8px; }
.lrow { display: flex; gap: 8px; align-items: flex-end; background: var(--surface-2); padding: 10px; border-radius: 12px; flex-wrap: wrap; }
.lrow label { display: flex; flex-direction: column; gap: 3px; flex: 1 1 90px; font-size: 11px; color: var(--ink-3); font-weight: 600; }
.lrow label:first-child { flex: 2 1 150px; }

.rank-ctl .icon-btn { padding: 6px 12px; font-size: 14px; min-width: 40px; min-height: 32px; }

<body>
<div id="app"></div>
<div id="modal"></div>
<noscript>Our Nest needs JavaScript turned on.</noscript>
<script>
/* ===== Our Nest — data model & calculations ===== */
'use strict';

const PERIODS = { weekly: 52, biweekly: 26, semimonthly: 24, monthly: 12, quarterly: 4, yearly: 1 };
const PERIOD_LABEL = { weekly: 'Weekly', biweekly: 'Every 2 weeks', semimonthly: 'Twice a month', monthly: 'Monthly', quarterly: 'Quarterly', yearly: 'Yearly' };
const TWO_CHECK = { weekly: 4, biweekly: 2, semimonthly: 2, monthly: 1 };

const ACCOUNT_TYPES = {
  checking: { label: 'Checking', group: 'cash' },
  savings: { label: 'Savings', group: 'cash' },
  hysa: { label: 'High-yield savings', group: 'cash' },
  '401k': { label: '401(k)', group: 'retire' },
  '403b': { label: '403(b)', group: 'retire' },
  'ira-roth': { label: 'Roth IRA', group: 'retire' },
  'ira-trad': { label: 'Traditional IRA', group: 'retire' },
  hsa: { label: 'HSA', group: 'invest' },
  brokerage: { label: 'Brokerage', group: 'invest' },
  credit: { label: 'Credit card', group: 'debt' },
  loan: { label: 'Loan', group: 'debt' },
  mortgage: { label: 'Mortgage', group: 'debt' },
  other: { label: 'Other', group: 'cash' }
};
const isRetireType = t => ACCOUNT_TYPES[t] && ACCOUNT_TYPES[t].group === 'retire';
const isDebtType = t => ACCOUNT_TYPES[t] && ACCOUNT_TYPES[t].group === 'debt';
const isIraType = t => t === 'ira-roth' || t === 'ira-trad';

const BILL_CATEGORIES = ['Housing', 'Utilities', 'Transportation', 'Insurance', 'Subscriptions', 'Phone & Internet', 'Debt payments', 'Health', 'Food', 'Kids & Pets', 'Personal', 'Other'];

const uid = () => Math.random().toString(36).slice(2, 10);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const localISO = dt => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
const todayISO = () => localISO(new Date());

function defaultBinder() {
  return {
    contacts: [],
    notes: [
      { id: uid(), title: 'Where our passwords are', body: '' , hint: 'Name the password manager or where the master list is kept. Do NOT type passwords here.' },
      { id: uid(), title: 'Life insurance & beneficiaries', body: '', hint: 'Company, policy owner, who to call, and where the policy paperwork is.' },
      { id: uid(), title: 'Will & important documents', body: '', hint: 'Where the will, deed, titles, birth/marriage certificates, and tax returns are kept.' },
      { id: uid(), title: 'Work benefits', body: '', hint: 'Employer benefits worth claiming: group life insurance, final paycheck, unused PTO payout, 401(k)/403(b) beneficiary claims.' }
    ],
    checklist: [
      'Breathe. Nothing on this list has to happen today. The bills below pay themselves automatically.',
      'Order 8–10 certified copies of the death certificate (the funeral home can help).',
      'Call the HR contact below about final pay, group life insurance, and retirement account beneficiary claims.',
      'Call the life insurance company to start a claim.',
      'Keep the main checking account open and funded so autopays keep working.',
      'Notify Social Security (1-800-772-1213) and ask about survivor benefits.',
      'Don\'t make big money decisions (selling the house, investing a payout) for at least a few months.',
      'Talk to a fee-only financial advisor or estate attorney before moving retirement money.'
    ]
  };
}

function defaultData() {
  return {
    version: 1,
    appName: 'Our Nest',
    created: todayISO(),
    settings: {
      theme: 'auto',
      budgetBasis: 'average', // 'average' (checks/yr ÷ 12) or 'two' (2 checks/month, extras are bonus)
      returnLow: 4, returnMid: 6.5, returnHigh: 9,
      inflation: 2.5,
      defaultYears: 30,
      limits: { year: 2026, k401: 24500, k401catch: 8000, ira: 7500, iraCatch: 1100 },
      tabs: ['home', 'income', 'bills', 'goals'],
      lastBackup: null,
      pinHash: null,
      onboarded: false
    },
    people: [],
    accounts: [],
    bills: [],
    goals: [],
    giving: { enabled: true, label: 'Tithe', percent: 10, basis: 'gross', personIds: [], extraMonthly: 0, accountId: '', hourlyPlan: 'auto' },
    paylog: [],
    snapshots: [],
    binder: defaultBinder()
  };
}

function newPerson(name) {
  return {
    id: uid(), name: name || 'New person', payType: 'salary', frequency: 'biweekly',
    salary: 0, rate: 0, hours: 80, diffs: [], otHours: 0, otMult: 1.5, budgetOn: 'floor',
    retirePct: 0, retireAccountId: '', matchPct: 0,
    deductions: [], taxMode: 'percent', taxFixed: 0, taxPct: 22,
    age: null, retireAge: 65, lastPayday: ''
  };
}

/* Normalize/upgrade loaded data so missing fields never crash the UI */
function normalize(d) {
  const base = defaultData();
  d = Object.assign({}, base, d || {});
  d.settings = Object.assign({}, base.settings, d.settings || {});
  d.settings.limits = Object.assign({}, base.settings.limits, (d.settings.limits || {}));
  d.giving = Object.assign({}, base.giving, d.giving || {});
  d.binder = Object.assign({}, base.binder, d.binder || {});
  ['people', 'accounts', 'bills', 'goals', 'snapshots', 'paylog'].forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });
  d.people = d.people.map(p => Object.assign(newPerson(), p, { diffs: p.diffs || [], deductions: p.deductions || [] }));
  d.goals.forEach(g => { g.celebrated = g.celebrated || []; });
  return d;
}

/* ---------- Pay ---------- */
function personName(d, id) {
  if (id === 'joint') return 'Joint';
  if (id === 'shared') return 'Shared';
  const p = d.people.find(x => x.id === id); return p ? p.name : '';
}

function diffPay(p, df) {
  const h = num(df.hours);
  return df.mode === 'percent' ? num(p.rate) * num(df.amount) / 100 * h : num(df.amount) * h;
}

/* One paycheck, either the guaranteed floor or the expected (with differentials + OT). */
function paycheck(p, mode) {
  const freq = PERIODS[p.frequency] || 26;
  let floor, extra = 0;
  if (p.payType === 'hourly') {
    floor = num(p.rate) * num(p.hours);
    extra = p.diffs.reduce((s, df) => s + diffPay(p, df), 0) + num(p.otHours) * num(p.rate) * num(p.otMult || 1.5);
  } else {
    floor = num(p.salary) / freq;
  }
  const useExtra = mode === 'expected' || (mode === 'budget' && p.payType === 'hourly' && p.budgetOn === 'expected');
  const gross = floor + (useExtra ? extra : 0);
  const retire = gross * num(p.retirePct) / 100;
  const match = gross * num(p.matchPct) / 100;
  const fixedDed = p.deductions.reduce((s, x) => s + num(x.amount), 0);
  const tax = p.taxMode === 'fixed' ? num(p.taxFixed) : Math.max(0, gross - retire - fixedDed) * num(p.taxPct) / 100;
  const net = gross - retire - fixedDed - tax;
  return { freq, floor, extra, gross, retire, match, fixedDed, tax, net };
}

function checksPerMonth(d, p) {
  if (d.settings.budgetBasis === 'two' && TWO_CHECK[p.frequency]) return TWO_CHECK[p.frequency];
  return (PERIODS[p.frequency] || 26) / 12;
}

/* ---------- Money out ---------- */
const toMonthly = (amt, freq) => num(amt) * (PERIODS[freq] || 12) / 12;
const billMonthly = b => toMonthly(b.amount, b.frequency);

function monthsBetween(fromISO, toISO) {
  const a = new Date(fromISO + 'T00:00:00'), b = new Date(toISO + 'T00:00:00');
  return (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()) + (b.getDate() - a.getDate()) / 30.44;
}

function goalTarget(d, g, ctx) {
  if (g.targetSource === 'home') return num(g.homePrice) * num(g.downPct) / 100;
  if (g.targetSource === 'emergency') return num(g.emMonths) * (ctx ? ctx.essentialM : 0);
  if (g.targetSource === 'manual') return num(g.target);
  return 0;
}

function goalSaved(d, g) {
  if (g.accountId) {
    const a = d.accounts.find(x => x.id === g.accountId);
    if (a && isRetireType(a.type)) return num(a.balance);
  }
  return num(g.saved);
}

function goalMonthly(d, g, ctx) {
  if (g.kind === 'target') {
    const target = goalTarget(d, g, ctx);
    const remaining = Math.max(0, target - goalSaved(d, g));
    if (!g.targetDate) return 0;
    const m = Math.max(1, monthsBetween(todayISO(), g.targetDate));
    return remaining / m;
  }
  return toMonthly(g.amount, g.per === 'yearly' ? 'yearly' : 'monthly');
}

/* months until saved reaches target, with optional APY; null if never */
function monthsToTarget(saved, monthly, target, apy) {
  if (target <= 0) return null;
  if (saved >= target) return 0;
  const r = num(apy) / 100 / 12;
  let bal = saved, m = 0;
  while (bal < target && m < 1200) { bal = bal * (1 + r) + monthly; m++; }
  return m >= 1200 ? null : m;
}

/* ---------- Household roll-up ---------- */
function summarize(d) {
  const s = { people: [], grossM: 0, netM: 0, retireM: 0, matchM: 0, taxM: 0, dedM: 0, expectedNetM: 0, floorNetM: 0 };
  d.people.forEach(p => {
    const cpm = checksPerMonth(d, p);
    const b = paycheck(p, 'budget'), fl = paycheck(p, 'floor'), ex = paycheck(p, 'expected');
    const avg = (PERIODS[p.frequency] || 26) / 12;
    const row = { p, cpm, b, fl, ex,
      grossM: b.gross * cpm, netM: b.net * cpm, retireM: b.retire * avg, matchM: b.match * avg,
      retireYear: b.retire * (PERIODS[p.frequency] || 26),
      floorNetM: fl.net * cpm, expectedNetM: ex.net * cpm };
    s.people.push(row);
    s.grossM += row.grossM; s.netM += row.netM; s.retireM += b.retire * cpm; s.matchM += row.matchM;
    s.taxM += b.tax * cpm; s.dedM += b.fixedDed * cpm;
    s.floorNetM += row.floorNetM; s.expectedNetM += row.expectedNetM;
  });
  s.upsideM = s.expectedNetM - s.netM; // money above what the budget assumes

  s.billsM = d.bills.reduce((t, b) => t + billMonthly(b), 0);
  s.subsM = d.bills.filter(b => b.isSub).reduce((t, b) => t + billMonthly(b), 0);

  // giving
  const gv = d.giving;
  s.givingM = 0; s.givingExpectedM = 0;

  if (gv.enabled) {
    s.people.forEach(r => {
      if (!gv.personIds.includes(r.p.id)) return;
      const plan = givingPlanFor(d, r);
      s.givingPlan[r.p.id] = plan;
      const baseEx = gv.basis === 'net' ? r.expectedNetM : r.ex.gross * r.cpm;

  const ctx = { essentialM: s.essentialM };
  s.goals = d.goals.map(g => {
    const acct = d.accounts.find(a => a.id === g.accountId);
    const retire = !!(acct && isRetireType(acct.type));
    const monthly = goalMonthly(d, g, ctx);
    const target = goalTarget(d, g, ctx);
    const saved = goalSaved(d, g);
    const pct = target > 0 ? Math.min(1, saved / target) : null;
    const eta = target > 0 ? monthsToTarget(saved, monthly, target, g.apy) : null;
    const etaNoGrowth = target > 0 ? monthsToTarget(saved, monthly, target, 0) : null;
    return { g, acct, retire, monthly, target, saved, pct, eta, etaNoGrowth };

  s.leftoverM = s.netM - s.billsM - s.givingM - s.goalsM;

  s.assets = d.accounts.filter(a => !isDebtType(a.type)).reduce((t, a) => t + num(a.balance), 0);
  s.debts = d.accounts.filter(a => isDebtType(a.type)).reduce((t, a) => t + Math.abs(num(a.balance)), 0);
  s.netWorth = s.assets - s.debts;
  s.retireBal = d.accounts.filter(a => isRetireType(a.type)).reduce((t, a) => t + num(a.balance), 0);
  return s;
}

/* ---------- Retirement projection ---------- */
function yearsToRetire(d, ownerId) {
  const p = d.people.find(x => x.id === ownerId);
  if (p && p.age && p.retireAge) return Math.max(0, num(p.retireAge) - num(p.age));
  return null;
}

function retirementPlan(d, s) {
  const accts = d.accounts.filter(a => isRetireType(a.type));
  const rows = accts.map(a => {
    let monthly = 0, fromPay = 0, match = 0;
    s.people.forEach(r => {
      if (r.p.retireAccountId === a.id) { fromPay += r.retireM; match += r.matchM; }
    });
    const fromGoals = s.goals.filter(x => x.g.accountId === a.id).reduce((t, x) => t + x.monthly, 0);
    monthly = fromPay + match + fromGoals;
    let years = yearsToRetire(d, a.owner);
    const assumed = years === null;
    if (assumed) years = num(d.settings.defaultYears) || 30;
    return { a, fromPay, match, fromGoals, monthly, years, assumed };
  });
  return rows;
}

function fv(balance, monthly, ratePct, months) {
  const r = ratePct / 100 / 12;
  if (r === 0) return balance + monthly * months;
  const g = Math.pow(1 + r, months);
  return balance * g + monthly * (g - 1) / r;
}

/* Combined balance per year for a scenario; contributions stop at each owner's retirement */
function projectSeries(rows, ratePct, horizonYears, extraMonthly, inflationPct, todaysDollars) {
  const out = [];
  for (let y = 0; y <= horizonYears; y++) {
    let tot = 0;
    rows.forEach((row, i) => {
      const contribYears = Math.min(y, row.years);
      const c = row.monthly + (i === 0 ? extraMonthly : 0);
      let v = fv(num(row.a.balance), c, ratePct, contribYears * 12);
      if (y > row.years) v = fv(v, 0, ratePct, (y - row.years) * 12);
      tot += v;
    });
    if (todaysDollars) tot = tot / Math.pow(1 + inflationPct / 100, y);
    out.push(tot);
  }
  return out;
}

/* ---------- Paydays / extra-paycheck months ---------- */
function extraPaycheckMonths(p, monthsAhead) {
  if (!p.lastPayday || !(p.frequency === 'biweekly' || p.frequency === 'weekly')) return [];
  const step = p.frequency === 'weekly' ? 7 : 14;
  const normal = p.frequency === 'weekly' ? 4 : 2;
  const start = new Date(); start.setDate(1); start.setHours(0, 0, 0, 0);
  const end = new Date(start); end.setMonth(end.getMonth() + monthsAhead);
  let dt = new Date(p.lastPayday + 'T00:00:00');
  while (dt > start) dt.setDate(dt.getDate() - step);
  const counts = {};
  while (dt < end) {
    if (dt >= start) { const k = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0'); counts[k] = (counts[k] || 0) + 1; }
    dt.setDate(dt.getDate() + step);
  }
  return Object.keys(counts).filter(k => counts[k] > normal).map(k => ({ month: k, extra: counts[k] - normal }));
}

/* ---------- Giving on variable pay ----------

   (recent real stubs → expected with differentials → base pay), while the LOG
   settles the exact amount from each actual paystub. */

}

  if (r.p.payType === 'hourly') {
    const mode = gv.hourlyPlan || 'auto';
    const act = recentAvg(payLogFor(d, r.p.id), key, 6);
    const hasExtra = r.ex.gross - r.fl.gross > 0.01;
    if ((mode === 'actual' || mode === 'auto') && act && act.count >= (mode === 'auto' ? 3 : 1)) { source = 'actual'; base = act.avg; }
    else if ((mode === 'expected' || mode === 'auto') && hasExtra) { source = 'expected'; base = r.ex[key]; }
    else if (mode === 'floor' || mode === 'auto' || mode === 'actual' || mode === 'expected') { source = 'floor'; base = r.fl[key]; }

function givingOwed(d) {

/* Paydays since the anchor date that have no logged stub (±4 days) */
function pendingPaydays(d, p) {

  const step = { weekly: 7, biweekly: 14 }[p.frequency];
  const today = new Date(); today.setHours(23, 59, 59, 0);
  const anchor = new Date(p.lastPayday + 'T00:00:00');
  const log = payLogFor(d, p.id).map(e => new Date(e.date + 'T00:00:00').getTime());
  const dates = [];
  if (step) { for (let t = new Date(anchor); t <= today; t.setDate(t.getDate() + step)) dates.push(new Date(t)); }

/* ---------- Calendar: when money moves ---------- */
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
/* Days (1-based) in month y/m (m 0-based) on which a schedule falls */
function occurrences(kind, opts, y, m) {
  const out = [], last = dim(y, m);
  const clampDay = d => Math.min(Math.max(1, Math.round(num(d))), last);
  if (kind === 'monthly') { if (num(opts.day) > 0) out.push(clampDay(opts.day)); return out; }
  if (kind === 'semimonthly') {
    if (num(opts.day) > 0) { const a = clampDay(opts.day); out.push(a); const b = num(opts.day) + 15 > 28 ? last : clampDay(num(opts.day) + 15); if (b !== a) out.push(b); }
    else if (opts.anchor) { out.push(15, last); }
    return out;
  }
  if (!opts.anchor) return out;
  const a = new Date(opts.anchor + 'T00:00:00');
  const start = new Date(y, m, 1), end = new Date(y, m, last);
  if (kind === 'weekly' || kind === 'biweekly') {
    const step = kind === 'weekly' ? 7 : 14;
    const t = new Date(a);
    const diff = Math.floor((start - t) / 864e5);
    if (diff > 0) t.setDate(t.getDate() + Math.ceil(diff / step) * step);
    else while (t - start > step * 864e5) t.setDate(t.getDate() - step);
    while (t < start) t.setDate(t.getDate() + step);
    for (; t <= end; t.setDate(t.getDate() + step)) out.push(t.getDate());
    return out;
  }
  const every = { quarterly: 3, yearly: 12 }[kind];
  if (every) {
    const months = (y - a.getFullYear()) * 12 + (m - a.getMonth());
    if (((months % every) + every) % every === 0) out.push(Math.min(a.getDate(), last));
  }
  return out;
}

/* Every dated money movement in a month. type: in | bill | give | save */
function monthEvents(d, s, y, m) {
  const ev = [];
  const add = (day, e) => ev.push(Object.assign({ day, date: localISO(new Date(y, m, day)) }, e));
  // paydays + giving on each payday
  s.people.forEach(r => {
    const p = r.p;
    const kind = p.frequency;
    const days = kind === 'monthly' ? (p.lastPayday ? [Math.min(new Date(p.lastPayday + 'T00:00').getDate(), dim(y, m))] : [])
      : occurrences(kind, { anchor: p.lastPayday }, y, m);
    const plan = s.givingPlan && s.givingPlan[p.id];
    days.forEach(dd => {
      add(dd, { type: 'in', label: `${p.name} payday`, amount: r.b.net, approx: p.payType === 'hourly', ref: 'income' });
      if (plan && d.giving.enabled) add(dd, { type: 'give', label: `${d.giving.label || 'Giving'} · ${p.name}`, amount: plan.perCheck, approx: p.payType === 'hourly', ref: 'giving' });
    });
  });
  // bills
  d.bills.forEach(b => {
    const kind = b.frequency;
    const days = occurrences(kind, { day: b.dueDay, anchor: b.dueDate || (b.isSub ? b.renewal : '') }, y, m);
    days.forEach(dd => add(dd, { type: 'bill', label: b.name, amount: num(b.amount), ref: 'bill', id: b.id, autopay: b.autopay, accountId: b.accountId }));
  });
  // extra giving
  if (d.giving.enabled && num(d.giving.extraMonthly) > 0 && num(d.giving.extraDay) > 0) add(Math.min(num(d.giving.extraDay), dim(y, m)), { type: 'give', label: 'Extra giving', amount: num(d.giving.extraMonthly), ref: 'giving' });
  // goal / IRA transfers
  (s.goals || []).forEach(x => {
    const g = x.g;
    if (g.contribWhen === 'yearly') {
      occurrences('yearly', { anchor: g.contribDate }, y, m).forEach(dd => add(dd, { type: 'save', label: g.name, icon: g.icon, amount: x.monthly * 12, ref: 'goal', id: g.id, retire: x.retire }));
    } else if (num(g.contribDay) > 0 && x.monthly > 0) {
      add(Math.min(num(g.contribDay), dim(y, m)), { type: 'save', label: g.name, icon: g.icon, amount: x.monthly, ref: 'goal', id: g.id, retire: x.retire });
    }
  });
  const order = { in: 0, give: 1, bill: 2, save: 3 };
  return ev.sort((a, b) => a.day - b.day || order[a.type] - order[b.type]);
}

/* Things that move money but have no date yet */
function undatedItems(d, s) {
  const bills = d.bills.filter(b => {
    if (b.frequency === 'monthly' || b.frequency === 'semimonthly') return !(num(b.dueDay) > 0);
    return !(b.dueDate || (b.isSub && b.renewal));
  });
  const goals = (s.goals || []).filter(x => x.monthly > 0 && (x.g.contribWhen === 'yearly' ? !x.g.contribDate : !(num(x.g.contribDay) > 0)));
  const people = d.people.filter(p => !p.lastPayday);
  return { bills, goals, people };
}

/* ---------- Snapshots ---------- */
function snapshotNetWorth(d, snap) {
  let t = 0;
  Object.keys(snap.balances || {}).forEach(id => {
    const a = d.accounts.find(x => x.id === id);
    const v = num(snap.balances[id]);
    if (a && isDebtType(a.type)) t -= Math.abs(v); else t += v;
  });
  return t;
}

function actualPayStats(d, personId) {
  const checks = [];
  d.snapshots.forEach(sn => { ((sn.paychecks || {})[personId] || []).forEach(v => { if (num(v) > 0) checks.push(num(v)); }); });
  payLogFor(d, personId).forEach(e => { if (num(e.net) > 0) checks.push(num(e.net)); });
  if (!checks.length) return null;
  const recent = checks.slice(-12);
  return { count: recent.length, avg: recent.reduce((a, b) => a + b, 0) / recent.length, all: checks };
}

/* ---------- Backup crypto ---------- */
async function deriveKey(pass, salt) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}

const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  const key = await deriveKey(pass, salt);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { ournestEncrypted: 1, salt: b64(salt), iv: b64(iv), data: b64(ct) };
}

  const key = await deriveKey(pass, unb64(wrapper.salt));

/* ===== Our Nest — tiny SVG chart kit (no libraries, works offline) ===== */

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const HIDDEN = { on: false };
const MASK = '$•••••', MASK_SHORT = '$•••';
const money = (n, cents) => {

  return (v < 0 ? '−$' : '$') + s;
};
const moneyShort = n => {

  if (v >= 1e3) return sign + '$' + (v / 1e3).toFixed(v >= 1e5 ? 0 : 1).replace(/\.0$/, '') + 'k';

const pct = (n, d = 0) => (n * 100).toFixed(d) + '%';

/* Charts register hover handlers keyed by id; one global tooltip element serves all. */
const Charts = { hover: {} };

function niceMax(v) {

/* Donut: segments [{label, value, color}] */
function donutChart(segments, opts = {}) {

    const large = e - s > Math.PI ? 1 : 0;

    ${paths}

/* Sankey-ish flow: sources [{label,value,color}] -> targets [{label,value,color}] through one middle node */

    y += h + gap; my += mh;

  for (let i = 1; i < labels.length; i++) labels[i].ly = Math.max(labels[i].ly, labels[i - 1].ly + LH);
  const over = labels.length ? labels[labels.length - 1].ly - (H - 12) : 0;
  if (over > 0) { labels.forEach(l => l.ly -= over); for (let i = labels.length - 2; i >= 0; i--) labels[i].ly = Math.min(labels[i].ly, labels[i + 1].ly - LH); }
  labels.forEach(({ t, ly }) => {
    out += `<text x="${xR + nodeW + 6}" y="${ly - 7}" dominant-baseline="middle" class="fl-l">${esc(t.label)}</text>`;
    out += `<text x="${xR + nodeW + 6}" y="${ly + 9}" dominant-baseline="middle" class="fl-v">${moneyShort(t.value)} · ${pct(t.value / tTotal)}</text>`;
  });
  return `<svg class="chart flowchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'Where the money goes')}">${out}</svg>`;
}

/* Line chart with optional band. series: [{name, values[], color, dash}], xLabels[] */
function lineChart(id, cfg) {
  const W = 640, H = cfg.height || 260, L = 56, R = 16, T = 14, B = 28;
  const all = [];
  cfg.series.forEach(s => all.push(...s.values));
  if (cfg.band) all.push(...cfg.band.high);
  const maxV = niceMax(Math.max(1, ...all));
  const minV = cfg.minZero === false ? Math.min(0, ...all) : 0;
  const n = cfg.xLabels.length;
  const x = i => L + (n <= 1 ? 0 : i * (W - L - R) / (n - 1));
  const yv = v => T + (H - T - B) * (1 - (v - minV) / (maxV - minV || 1));
  let g = '';
  for (let k = 0; k <= 4; k++) {
    const v = minV + (maxV - minV) * k / 4, yy = yv(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" class="grid"></line><text x="${L - 8}" y="${yy}" text-anchor="end" dominant-baseline="middle" class="axis">${moneyShort(v)}</text>`;
  }
  const every = Math.max(1, Math.ceil(n / 7));
  cfg.xLabels.forEach((lab, i) => { if (i % every === 0 || i === n - 1) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" class="axis">${esc(lab)}</text>`; });
  if (cfg.band) {
    const up = cfg.band.high.map((v, i) => `${x(i)},${yv(v)}`).join(' ');
    const dn = cfg.band.low.map((v, i) => `${x(i)},${yv(v)}`).reverse().join(' ');
    g += `<polygon points="${up} ${dn}" fill="${cfg.band.color}" opacity="0.16"></polygon>`;
  }
  cfg.series.forEach(s => {
    const pts = s.values.map((v, i) => `${x(i)},${yv(v)}`).join(' ');
    g += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="5 5"' : ''}></polyline>`;
    if (s.endLabel && s.values.length) {
      const i = s.values.length - 1;
      g += `<circle cx="${x(i)}" cy="${yv(s.values[i])}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"></circle>`;
    }
  });
  g += `<line class="xhair" x1="0" x2="0" y1="${T}" y2="${H - B}" style="display:none"></line>`;
  g += `<rect class="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" data-chart="${id}"></rect>`;
  Charts.hover[id] = { W, L, R, n, x, cfg, yv };
  return `<svg class="chart line" id="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.label || 'Line chart')}">${g}</svg>`;
}

/* Horizontal bars for category totals */
function hBars(items, color) {
  const max = Math.max(1, ...items.map(i => i.value));
  return `<div class="hbars">${items.map(i => `<div class="hb-row" data-tip="${esc(i.label)}|${money(i.value, true)}/mo · ${money(i.value * 12)}/yr">
    <span class="hb-l">${esc(i.label)}</span>
    <span class="hb-track"><span class="hb-fill" style="width:${(i.value / max * 100).toFixed(1)}%;background:${i.color || color}"></span></span>
    <span class="hb-v">${money(i.value)}</span></div>`).join('')}</div>`;
}

/* Ring gauge (single value) */
function ring(frac, label, color) {
  const r = 42, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac));
  return `<svg class="ring" viewBox="0 0 100 100" role="img" aria-label="${esc(label)}">
    <circle cx="50" cy="50" r="${r}" class="ring-track"></circle>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(c * f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 50 50)"></circle>
    <text x="50" y="50" text-anchor="middle" dominant-baseline="central" class="ring-t">${pct(f)}</text></svg>`;
}

/* ---- global tooltip wiring ---- */
function initTooltips() {
  const tip = document.createElement('div');
  tip.className = 'tooltip'; tip.setAttribute('role', 'status');
  document.body.appendChild(tip);
  const show = (html, ev) => {
    tip.innerHTML = html; tip.style.display = 'block';
    const pad = 12, w = tip.offsetWidth, h = tip.offsetHeight;
    let lx = ev.clientX + pad, ly = ev.clientY - h - pad;
    if (lx + w > window.innerWidth - 8) lx = ev.clientX - w - pad;
    if (ly < 8) ly = ev.clientY + pad;
    tip.style.left = lx + 'px'; tip.style.top = ly + 'px';
  };
  const hide = () => { tip.style.display = 'none'; document.querySelectorAll('.xhair').forEach(l => l.style.display = 'none'); };
  const handle = ev => {
    const t = ev.target.closest('[data-tip]');
    if (t) { const [a, b] = t.dataset.tip.split('|'); show(`<b>${a}</b>${b ? '<br>' + b : ''}`, ev); return; }
    const hit = ev.target.closest('rect.hit');
    if (hit) {
      const h = Charts.hover[hit.dataset.chart]; if (!h) return;
      const svg = hit.ownerSVGElement, box = svg.getBoundingClientRect();
      const sx = (ev.clientX - box.left) * h.W / box.width;
      const i = Math.max(0, Math.min(h.n - 1, Math.round((sx - h.L) / ((h.W - h.L - h.R) / Math.max(1, h.n - 1)))));
      const line = svg.querySelector('.xhair'); line.style.display = ''; line.setAttribute('x1', h.x(i)); line.setAttribute('x2', h.x(i));
      let html = `<b>${esc(h.cfg.xLabels[i])}${h.cfg.xSuffix ? esc(h.cfg.xSuffix[i] || '') : ''}</b>`;
      h.cfg.series.forEach(s => { html += `<br><span class="sw" style="background:${s.color}"></span>${esc(s.name)}: ${money(s.values[i])}`; });
      if (h.cfg.band) html += `<br><span class="muted">Range: ${moneyShort(h.cfg.band.low[i])} – ${moneyShort(h.cfg.band.high[i])}</span>`;
      show(html, ev); return;
    }
    hide();
  };
  document.addEventListener('mousemove', handle);
  document.addEventListener('click', ev => { if (ev.target.closest('[data-tip], rect.hit')) handle(ev); });
  document.addEventListener('scroll', hide, true);
}

/* ---------- confetti ---------- */
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
  const ctx = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const col = Object.values(COLORS());
  const P = Array.from({ length: 140 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight / 3, vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 4, r: Math.random() * 6 + 3, c: col[Math.floor(Math.random() * col.length)], a: Math.random() * 6 }));
  let f = 0;
  (function tick() {
    ctx.clearRect(0, 0, c.width, c.height);
    P.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
    if (++f < 150) requestAnimationFrame(tick); else c.remove();
  })();
}

/* =====================================================================
   FORMS — one modal builder for every editor in the app
   ===================================================================== */
let form = null;
function openForm(cfg) {
  form = Object.assign({}, cfg, { v: JSON.parse(JSON.stringify(cfg.value || {})) });
  renderForm();
}
function closeForm() { form = null; $('#modal').innerHTML = ''; $('#modal').classList.remove('open'); }

function fieldHTML(f, v) {
  if (f.show && !f.show(v)) return '';
  const val = v[f.k];
  const id = 'f_' + f.k;
  const help = f.help ? `<small class="help">${f.help}</small>` : '';
  const cls = 'field' + (f.half ? ' half' : '');
  switch (f.type) {
    case 'select':
      return `<label class="${cls}"><span>${esc(f.label)}</span><select id="${id}" data-k="${f.k}" ${f.live ? 'data-live' : ''}>${(typeof f.options === 'function' ? f.options(v) : f.options).map(o => opt(o[0], o[1], val)).join('')}</select>${help}</label>`;
    case 'check':
      return `<label class="${cls} check"><input type="checkbox" id="${id}" data-k="${f.k}" ${val ? 'checked' : ''} ${f.live ? 'data-live' : ''}><span>${esc(f.label)}</span>${help}</label>`;
    case 'checks':
      return `<fieldset class="${cls}"><legend>${esc(f.label)}</legend>${f.options.map(o => `<label class="check inline"><input type="checkbox" data-k="${f.k}" data-multi="${esc(o[0])}" ${(val || []).includes(o[0]) ? 'checked' : ''}><span>${esc(o[1])}</span></label>`).join('')}${help}</fieldset>`;
    case 'textarea':
      return `<label class="${cls}"><span>${esc(f.label)}</span><textarea id="${id}" data-k="${f.k}" rows="${f.rows || 4}" placeholder="${esc(f.placeholder || '')}">${esc(val || '')}</textarea>${help}</label>`;
    case 'list': {
      const rows = (val || []).map((row, i) => `<div class="lrow">${f.cols.map(c => c.type === 'select'
        ? `<label><span>${esc(c.label)}</span><select data-list="${f.k}" data-i="${i}" data-c="${c.k}">${c.options.map(o => opt(o[0], o[1], row[c.k])).join('')}</select></label>`
        : `<label><span>${esc(c.label)}</span><input type="${c.type === 'text' ? 'text' : 'number'}" step="any" inputmode="${c.type === 'text' ? 'text' : 'decimal'}" value="${esc(row[c.k] ?? '')}" data-list="${f.k}" data-i="${i}" data-c="${c.k}" data-num="${c.type !== 'text' ? 1 : ''}"></label>`).join('')}
        <button type="button" class="icon-btn" data-fact="rm" data-list="${f.k}" data-i="${i}" aria-label="Remove">✕</button></div>`).join('');
      return `<div class="field list"><span class="lbl">${esc(f.label)}</span>${help}${rows || '<p class="muted small">None yet.</p>'}<button type="button" class="btn ghost sm" data-fact="add" data-list="${f.k}">+ ${esc(f.addLabel || 'Add')}</button></div>`;
    }
    default: {
      const isNum = ['number', 'money', 'percent'].includes(f.type);
      const pre = f.type === 'money' ? '<i>$</i>' : '', post = f.type === 'percent' ? '<i>%</i>' : (f.suffix ? `<i>${f.suffix}</i>` : '');
      return `<label class="${cls}"><span>${esc(f.label)}</span><div class="inp ${pre ? 'pre' : ''} ${post ? 'post' : ''}">${pre}<input id="${id}" data-k="${f.k}" type="${f.type === 'date' ? 'date' : f.type === 'password' ? 'password' : isNum ? 'number' : 'text'}" ${isNum ? 'step="any" inputmode="decimal"' : ''} ${f.max ? `maxlength="${f.max}"` : ''} value="${esc(val ?? '')}" placeholder="${esc(f.placeholder || '')}" ${f.live ? 'data-live' : ''} ${isNum ? 'data-num="1"' : ''}>${post}</div>${help}</label>`;
    }
  }
}

function renderForm() {
  if (!form) return;
  const m = $('#modal');
  const preview = form.preview ? `<div class="form-preview">${form.preview(form.v)}</div>` : '';
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(form.title)}">
    <header><h2>${esc(form.title)}</h2><button class="icon-btn" data-fact="close" aria-label="Close">✕</button></header>
    ${form.intro ? `<p class="muted">${form.intro}</p>` : ''}
    <div class="form-body">${form.fields.map(f => fieldHTML(f, form.v)).join('')}</div>
    ${preview}
    <footer>${form.onDelete ? `<button class="btn danger ghost" data-fact="delete">${esc(form.deleteLabel || 'Delete')}</button>` : '<span></span>'}
    <div><button class="btn ghost" data-fact="close">Cancel</button> <button class="btn primary" data-fact="save">${esc(form.saveLabel || 'Save')}</button></div></footer></div>`;
  m.classList.add('open');
}

function readFormInput(el) {
  if (!form) return;
  if (el.dataset.list) {
    const arr = form.v[el.dataset.list]; const row = arr[+el.dataset.i];
    row[el.dataset.c] = el.dataset.num ? (el.value === '' ? '' : parseFloat(el.value)) : el.value;
    return;
  }
  const k = el.dataset.k; if (!k) return;
  if (el.dataset.multi !== undefined) {
    const arr = new Set(form.v[k] || []); el.checked ? arr.add(el.dataset.multi) : arr.delete(el.dataset.multi); form.v[k] = [...arr];
  } else if (el.type === 'checkbox') form.v[k] = el.checked;
  else if (el.dataset.num) form.v[k] = el.value === '' ? '' : parseFloat(el.value);
  else form.v[k] = el.value;
}

function wireModal() {
  const m = $('#modal');
  m.addEventListener('input', e => {
    readFormInput(e.target);
    if (form && form.preview) { const pv = $('.form-preview', m); if (pv) pv.innerHTML = form.preview(form.v); }
  });
  m.addEventListener('change', e => {
    readFormInput(e.target);
    if (e.target.hasAttribute('data-live') || e.target.tagName === 'SELECT' || e.target.type === 'checkbox') {
      const scroll = $('.sheet', m) ? $('.sheet', m).scrollTop : 0;
      renderForm(); const sh = $('.sheet', m); if (sh) sh.scrollTop = scroll;
    }
  });
  m.addEventListener('click', e => {
    if (e.target === m) return closeForm();
    const b = e.target.closest('[data-fact]'); if (!b || !form) return;
    const a = b.dataset.fact;
    if (a === 'close') closeForm();
    if (a === 'save') {
      if (form.validate) { const err = form.validate(form.v); if (err) return toast(err, 'bad'); }
      const f = form; closeForm(); f.onSave(f.v); commit();
    }
    if (a === 'delete') {
      if (b.dataset.sure) { const f = form; closeForm(); f.onDelete(); commit(); }
      else { b.dataset.sure = 1; b.textContent = 'Tap again to confirm'; }
    }
    if (a === 'add') { const f = form.fields.find(x => x.k === b.dataset.list); form.v[f.k] = form.v[f.k] || []; form.v[f.k].push(f.newItem()); renderForm(); }
    if (a === 'rm') { form.v[b.dataset.list].splice(+b.dataset.i, 1); renderForm(); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && form) closeForm(); });
}

function calendarReminder(pid) {
  const p = D.people.find(x => x.id === pid); const nx = p && nextPayday(p);
  if (!nx) return toast('Add a recent payday for ' + (p ? p.name : 'them') + ' first (Money In → Edit)', 'bad');
  const ymd = dt => localISO(dt).replace(/-/g, '');
  const end = new Date(nx); end.setDate(end.getDate() + 1);
  const interval = p.frequency === 'weekly' ? 1 : 2;
  const label = D.giving.label || 'Giving';
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Our Nest//EN', 'BEGIN:VEVENT',
    'UID:' + uid() + '@ournest', 'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z',
    'DTSTART;VALUE=DATE:' + ymd(nx), 'DTEND;VALUE=DATE:' + ymd(end),
    `RRULE:FREQ=WEEKLY;INTERVAL=${interval}`,
    `SUMMARY:${p.name} payday — log stub & give ${label.toLowerCase()} 🙏`,
    `DESCRIPTION:Open Our Nest → ${label} → Log a paycheck. Enter the gross from the stub and it calculates the ${label.toLowerCase()}.`,
    'BEGIN:VALARM', 'TRIGGER:PT18H', 'ACTION:DISPLAY', 'DESCRIPTION:Log the paystub & give', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const blob = new Blob([ics], { type: 'text/calendar' });
  const name = `${p.name.toLowerCase()}-payday-reminder.ics`;
  const file = typeof File === 'function' ? new File([blob], name, { type: 'text/calendar' }) : null;
  if (file && navigator.canShare && navigator.canShare({ files: [file] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) navigator.share({ files: [file], title: name }).catch(() => plainDownload(blob, name));
  else plainDownload(blob, name);
  toast('Open the downloaded file to add the reminder to your calendar');
}

function stat(label, value, sub, cls) {
  return `<div class="stat ${cls || ''}"><span class="stat-l">${label}</span><span class="stat-v">${value}</span>${sub ? `<span class="stat-s">${sub}</span>` : ''}</div>`;
}
function card(title, body, opts = {}) {
  return `<section class="card ${opts.cls || ''}">${title ? `<header class="card-h"><h3>${title}</h3>${opts.action || ''}</header>` : ''}${body}</section>`;
}
function emptyState(msg, btn) { return `<div class="empty"><p>${msg}</p>${btn || ''}</div>`; }

/* ---------- HOME ---------- */
function viewHome() {
  const C = COLORS();
  const home = S.goals.find(x => x.g.targetSource === 'home');
  const lastBackup = D.settings.lastBackup;
  const backupDays = lastBackup ? Math.floor((Date.now() - new Date(lastBackup)) / 864e5) : null;
  let html = '';

  if (backupDays === null || backupDays > 30) {
    html += `<div class="banner"><span>💾 ${backupDays === null ? 'You haven\'t saved a backup yet.' : `Last backup was ${backupDays} days ago.`} Your data lives only on this device.</span><button class="btn sm primary" data-act="backup">Back up now</button></div>`;
  }

  // giving to-do
  const pendAll = D.giving.enabled ? D.people.filter(p => D.giving.personIds.includes(p.id) && p.payType === 'hourly').map(p => ({ p, n: pendingPaydays(D, p).length })).filter(x => x.n) : [];
  if (S.owed.count || pendAll.length) {
    const bits = [];
    if (S.owed.count) bits.push(`${money(S.owed.amount, true)} ready to give`);
    pendAll.forEach(x => bits.push(`${x.n} ${esc(x.p.name)} paystub${x.n > 1 ? 's' : ''} to log`));
    html += `<div class="banner good-banner"><span>🙏 ${esc(D.giving.label || 'Giving')}: ${bits.join(' · ')}</span><a class="btn sm primary" href="#/giving">Take care of it</a></div>`;
  }

  // hero — rotates through goals (priority order) + retirement outlook
  const slides = heroSlides();
  if (ui.heroIdx == null || ui.heroIdx >= slides.length) ui.heroIdx = 0;
  const heroGoal = slides.length ? `<div class="hero-rot" aria-roledescription="carousel" aria-label="Our goals">
      <div class="hero-track">${slides.map((sl, i) => `<div class="hero-goal ${i === ui.heroIdx ? 'on' : ''}" role="group" aria-roledescription="slide" aria-label="${i + 1} of ${slides.length}" ${i === ui.heroIdx ? '' : 'aria-hidden="true"'} ${sl.go ? `data-go="${sl.go}"` : ''}>
        <span class="hg-emoji">${esc(sl.icon)}</span><div><span class="hg-k">${esc(sl.kicker)}</span><b>${esc(sl.title)}</b><span>${sl.line}</span>${sl.pct != null ? `<div class="bar"><span style="width:${(Math.min(1, sl.pct) * 100).toFixed(1)}%"></span></div>` : ''}</div></div>`).join('')}</div>
      ${slides.length > 1 ? `<div class="hero-dots">${slides.map((sl, i) => `<button class="${i === ui.heroIdx ? 'on' : ''}" data-act="heroGo" data-i="${i}" aria-label="Show ${esc(sl.title)}"></button>`).join('')}</div>` : ''}</div>` : '';
  html += `<section class="hero"><div><p class="eyebrow">${greeting()}${D.people.length ? ', ' + esc(names()) : ''}</p>
    <h1>We're putting <em>${money(S.savedM)}</em> a month toward our future.</h1>
    <p class="hero-sub">That's ${pct(S.savingsRate)} of everything we earn${S.matchM > 0 ? `, plus ${money(S.matchM)} in employer match` : ''}.</p></div>${heroGoal}</section>`;

  html += `<div class="stats">
    ${stat('Take-home', money(S.netM), 'per month')}
    ${stat('Bills & subscriptions', money(S.billsM), money(S.subsM) + ' is subscriptions')}
    ${stat(esc(D.giving.label || 'Giving'), money(S.givingM), 'per month')}
    ${stat('Saving & investing', money(S.savedM), 'goals + paycheck retirement', 'good')}
    ${stat('Left over', money(S.leftoverM), money(S.leftoverM * 12 / 52) + ' per week', S.leftoverM < 0 ? 'bad' : 'accent')}
  </div>`;

  // flow
  const src = S.people.map((r, i) => ({ label: r.p.name, value: r.grossM, color: [C.p1, C.p2][i % 2] }));
  const leftover = Math.max(0, S.leftoverM);
  const goalsNonRet = S.goalsM - S.goalsRetireM;
  const tg = [
    { label: 'Taxes & benefits', value: S.taxM + S.dedM, color: C.neutral },
    { label: 'Retirement', value: S.retireM + S.goalsRetireM, color: C.s3 },
    { label: 'Savings goals', value: goalsNonRet, color: C.s5 },
    { label: 'Bills', value: S.billsM, color: C.s1 },
    { label: D.giving.label || 'Giving', value: S.givingM, color: C.s2 },
    { label: 'Left over', value: leftover, color: C.s4 }
  ];
  const flowTable = `<details class="tbl-toggle"><summary>Show as a table</summary><div class="tbl-scroll"><table class="tbl"><tbody>${tg.map(t => `<tr><td>${esc(t.label)}</td><td class="r">${money(t.value)}</td><td class="r muted">${pct(t.value / Math.max(1, S.grossM), 1)}</td></tr>`).join('')}<tr class="tot"><td>Gross income</td><td class="r">${money(S.grossM)}</td><td></td></tr></tbody></table></div></details>`;
  const shortfall = S.leftoverM < 0 ? `<p class="warn-text">⚠ The plan spends ${money(-S.leftoverM)} more than comes in each month.</p>` : '';
  html += card('Where every dollar goes', `<p class="muted small">Monthly, from gross pay. Hover or tap any band.</p>${flowChart(src, tg, innerWidth < 600 ? { compact: true, height: 340 } : { height: 330 })}${shortfall}${flowTable}`, { cls: 'wide' });

  // donut spent/saved/given
  const seg = [
    { label: 'Spent on bills', value: S.billsM, color: C.s1 },
    { label: 'Given', value: S.givingM, color: C.s2 },
    { label: 'Retirement', value: S.retireM + S.goalsRetireM, color: C.s3 },
    { label: 'Left over', value: leftover, color: C.s4 },
    { label: 'Savings goals', value: S.goalsM - S.goalsRetireM, color: C.s5 },
    { label: 'Taxes & benefits', value: S.taxM + S.dedM, color: C.neutral }
  ];
  const tot = seg.reduce((a, b) => a + b.value, 0) || 1;
  html += `<div class="grid2">` + card('Spent vs saved vs given', `<div class="donut-wrap">${donutChart(seg, { center: pct(S.savingsRate), sub: 'saved', label: 'Share of gross income' })}${legend(seg.map(s => ({ label: s.label, color: s.color, value: pct(s.value / tot) })))}</div>`);

  // goals mini
  const gl = S.goals.filter(x => !x.retire);
  html += card('Our goals', gl.length ? `<div class="mini-goals">${gl.map(x => `<div class="mg" data-go="goals"><span class="mg-i">${esc(x.g.icon || '⭐')}</span><div class="mg-b"><div class="mg-t"><b>${esc(x.g.name)}</b><span>${x.target ? money(x.saved) + ' / ' + money(x.target) : money(x.monthly) + '/mo'}</span></div>${x.target ? `<div class="bar"><span style="width:${((x.pct || 0) * 100).toFixed(1)}%"></span></div>` : ''}</div></div>`).join('')}</div>` : emptyState('No goals yet.', '<button class="btn primary sm" data-act="addGoal">Add a goal</button>'),
    { action: '<a href="#/goals" class="link">All goals →</a>' }) + `</div>`;

  // upside + extra paychecks
  let side = '';
  S.people.filter(r => r.p.payType === 'hourly').forEach(r => {
    const upM = r.expectedNetM - r.netM;
    const act = actualPayStats(D, r.p.id);
    let body = '';
    if (r.p.budgetOn === 'floor') {
      body += upM > 0.5
        ? `<p class="big-num good">+${money(upM)}<small>/mo expected above the budget</small></p><p class="muted small">The budget counts ${esc(r.p.name)}'s base pay only (${money(r.fl.net, true)} take-home per check). Differentials & OT should add about ${money(r.ex.net - r.fl.net, true)} per check.</p>`
        : `<p class="muted">The budget counts ${esc(r.p.name)}'s base pay only — the safe floor. Add her weekend/shift differentials to see the expected extra.</p><button class="btn sm ghost" data-act="editPerson" data-id="${r.p.id}">Add differentials</button>`;
    } else body += `<p class="muted small">Budgeting with expected pay including differentials (${money(r.ex.net, true)}/check).</p>`;
    if (act) {
      const diff = act.avg - r.fl.net;
      body += `<div class="reality"><span>Real paychecks (last ${act.count})</span><b>${money(act.avg, true)}</b><span class="${diff >= 0 ? 'good' : 'bad'}">${diff >= 0 ? '+' : ''}${money(diff, true)} vs floor</span></div>`;
    }
    side += card(`${esc(r.p.name)}'s shift upside`, body);
  });
  const extraMonths = [];
  S.people.forEach(r => extraPaycheckMonths(r.p, 12).forEach(m => extraMonths.push({ who: r.p.name, net: r.b.net, ...m })));
  side += card('Extra-paycheck months', extraMonths.length

function heroSlides() {
  const out = [];
  S.goals.filter(x => !x.retire).forEach((x, i) => {
    const g = x.g; const rank = `Goal #${i + 1}`;
    if (x.target) {
      const left = g.kind === 'target' && g.targetDate ? Math.max(0, monthsBetween(todayISO(), g.targetDate)) : x.eta;
      const when = x.pct >= 1 ? 'Reached! 🎉' : left != null && left > 0 ? durLabel(Math.round(left)) + ' to go' : x.monthly > 0 ? '' : 'Not funded yet';
      out.push({ icon: g.icon || '⭐', kicker: rank, title: g.name, line: `${when ? when + ' · ' : ''}${pct(x.pct || 0)} of ${money(x.target)}`, pct: x.pct || 0, go: 'goals' });
    } else if (x.monthly > 0) {
      out.push({ icon: g.icon || '⭐', kicker: rank, title: g.name, line: `${money(x.monthly)}/mo · ${money(x.saved)} saved so far`, pct: null, go: 'goals' });
    }
  });
  const rows = retirementPlan(D, S);
  if (rows.length) {
    const horizon = Math.max(...rows.map(r => r.years));
    const mid = projectSeries(rows, D.settings.returnMid, horizon, 0, D.settings.inflation, true);
    const end = mid[mid.length - 1];
    out.push({ icon: '🌴', kicker: 'Retirement · ' + (new Date().getFullYear() + horizon), title: `Could reach ${moneyShort(end)}`, line: `≈ ${money(end * 0.04 / 12)}/mo to live on · today's dollars`, pct: null, go: 'retire' });
  }
  if (S.netWorth && D.snapshots.length) out.push({ icon: '📈', kicker: 'Net worth', title: money(S.netWorth), line: `${D.snapshots.length} Money Date${D.snapshots.length > 1 ? 's' : ''} logged`, pct: null, go: 'home' });
  return out;
}
let heroTimer = null, heroPausedUntil = 0;
function heroShow(i) {
  const els = document.querySelectorAll('.hero-goal'), dots = document.querySelectorAll('.hero-dots button');
  if (!els.length) return;
  ui.heroIdx = (i + els.length) % els.length;
  els.forEach((e, k) => { e.classList.toggle('on', k === ui.heroIdx); if (k === ui.heroIdx) e.removeAttribute('aria-hidden'); else e.setAttribute('aria-hidden', 'true'); });
  dots.forEach((d, k) => d.classList.toggle('on', k === ui.heroIdx));
}
function heroPause(ms) { heroPausedUntil = Date.now() + ms; }
function wireHero() {
  clearInterval(heroTimer); heroTimer = null;
  const rot = $('.hero-rot'); if (!rot || document.querySelectorAll('.hero-goal').length < 2) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  rot.addEventListener('mouseenter', () => heroPause(1e9)); rot.addEventListener('mouseleave', () => heroPause(0));
  rot.addEventListener('focusin', () => heroPause(1e9)); rot.addEventListener('focusout', () => heroPause(0));
  let sx = null;
  rot.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  rot.addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) { heroShow(ui.heroIdx + (dx < 0 ? 1 : -1)); heroPause(6000); } sx = null; });
  heroTimer = setInterval(() => { if (Date.now() > heroPausedUntil && !document.hidden) heroShow(ui.heroIdx + 1); }, 5500);
}

/* ---------- CALENDAR ---------- */
const EV_STYLE = { in: { c: 'var(--good)', lbl: 'Money in', sign: '+' }, bill: { c: 'var(--s1)', lbl: 'Bill', sign: '−' }, give: { c: 'var(--s2)', lbl: 'Giving', sign: '−' }, save: { c: 'var(--s3)', lbl: 'Saving', sign: '→' } };

  return `<li class="ev ev-${e.type}" data-act="calOpen" data-ref="${e.ref}" data-id="${e.id || ''}" tabindex="0"><span class="ev-dot" style="background:${st.c}"></span><span class="ev-l"><b>${e.icon ? esc(e.icon) + ' ' : ''}${esc(e.label)}</b><small>${st.lbl}${e.type === 'bill' ? (e.autopay ? ' · autopay' : ' · <span class="warn-text">pay by hand</span>') : ''}${e.retire ? ' · retirement' : ''}${e.accountId ? ' · ' + esc(acctName(e.accountId)) : ''}</small></span><span class="ev-a ${e.type === 'in' ? 'good' : ''}">${st.sign}${money(e.amount, true)}${e.approx ? '<small class="est">est.</small>' : ''}</span></li>`;

function viewCalendar() {
  const now = new Date();
  if (!ui.cal) ui.cal = { y: now.getFullYear(), m: now.getMonth(), day: now.getDate() };
  const { y, m } = ui.cal;
  const isThisMonth = y === now.getFullYear() && m === now.getMonth();
  if (ui.cal.day == null) ui.cal.day = isThisMonth ? now.getDate() : 1;
  const ev = monthEvents(D, S, y, m);
  const last = new Date(y, m + 1, 0).getDate(), first = new Date(y, m, 1).getDay();
  const byDay = {}; ev.forEach(e => (byDay[e.day] = byDay[e.day] || []).push(e));
  const tot = t => ev.filter(e => e.type === t).reduce((a, e) => a + e.amount, 0);
  const half = (from, to) => ev.filter(e => e.day >= from && e.day <= to && e.type !== 'in').reduce((a, e) => a + e.amount, 0);
  const title = new Date(y, m, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  let html = `<div class="page-h"><div><h1>Calendar</h1><p class="muted">When money moves — paydays, bills, giving, and savings transfers.</p></div></div>`;
  html += `<div class="stats">${stat('Coming in', money(tot('in')), 'dated paydays this month', 'good')}${stat('Bills', money(tot('bill')), 'with due dates')}${stat(esc(D.giving.label || 'Giving'), money(tot('give')))}${stat('To savings & IRAs', money(tot('save')), '', 'accent')}${stat('1st–15th out', money(half(1, 15)), '16th–end: ' + money(half(16, 31)))}</div>`;

  // grid
  const wd = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  let cells = '';
  for (let i = 0; i < first; i++) cells += '<div class="cd empty"></div>';
  for (let d = 1; d <= last; d++) {
    const list = byDay[d] || [];
    const isToday = isThisMonth && d === now.getDate();
    const out = list.filter(e => e.type !== 'in').reduce((a, e) => a + e.amount, 0);
    const inn = list.filter(e => e.type === 'in').reduce((a, e) => a + e.amount, 0);
    cells += `<button class="cd ${isToday ? 'today' : ''} ${ui.cal.day === d ? 'sel' : ''} ${list.length ? 'has' : ''}" data-act="calDay" data-day="${d}" aria-label="${title.split(' ')[0]} ${d}: ${list.length} item${list.length === 1 ? '' : 's'}">
      <span class="cd-n">${d}</span>
      <span class="cd-chips">${list.slice(0, 3).map(e => `<span class="chip-ev" style="--c:${EV_STYLE[e.type].c}">${esc(e.label)}</span>`).join('')}${list.length > 3 ? `<span class="more-ev">+${list.length - 3} more</span>` : ''}</span>

      ${inn || out ? `<span class="cd-sum">${inn ? `<span class="good">+${moneyShort(inn)}</span>` : ''}${out ? `<span>−${moneyShort(out)}</span>` : ''}</span>` : ''}
    </button>`;
  }
  const legendHtml = Object.keys(EV_STYLE).map(k => `<span><i style="background:${EV_STYLE[k].c}"></i>${EV_STYLE[k].lbl}</span>`).join('');
  html += card(`<span class="cal-title">${title}</span>`, `<div class="cal-legend">${legendHtml}</div><div class="cal-grid">${wd.map(w => `<div class="wd">${w}</div>`).join('')}${cells}</div>`,
    { cls: 'wide cal-card', action: `<div class="btn-row"><button class="icon-btn" data-act="calNav" data-dir="-1" aria-label="Previous month">◀</button>${isThisMonth ? '' : '<button class="btn sm ghost" data-act="calToday">Today</button>'}<button class="icon-btn" data-act="calNav" data-dir="1" aria-label="Next month">▶</button></div>` });

  // selected day + rest of month
  const sel = byDay[ui.cal.day] || [];
  const selLabel = new Date(y, m, ui.cal.day).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  html += `<div class="grid2">` + `<section class="card" id="dayDetail"><header class="card-h"><h3>${selLabel}</h3></header>${sel.length ? `<ul class="evs">${sel.map(evRow).join('')}</ul>` : '<p class="muted">Nothing scheduled. A quiet day. ☕</p>'}</section>`;
  const upcoming = ev.filter(e => !isThisMonth || e.day >= now.getDate());
  const groups = {}; upcoming.forEach(e => (groups[e.day] = groups[e.day] || []).push(e));
  html += card(isThisMonth ? 'Rest of the month' : 'Whole month', Object.keys(groups).length ? Object.keys(groups).map(d => `<h4 class="agenda-d">${new Date(y, m, +d).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}</h4><ul class="evs">${groups[d].map(evRow).join('')}</ul>`).join('') : '<p class="muted">Nothing else dated this month.</p>') + `</div>`;

  // undated
  const un = undatedItems(D, S);
  if (un.bills.length || un.goals.length || un.people.length) {
    let b = `<p class="muted small">These move money but don't have a date yet, so they're missing from the calendar. Type a day and it saves instantly.</p>`;
    if (un.people.length) b += `<h4>Paydays</h4><div class="quick-list">${un.people.map(p => `<label class="quick"><span>${esc(p.name)} — a recent payday</span><input type="date" data-quick="payday" data-id="${p.id}"></label>`).join('')}</div>`;
    if (un.bills.length) b += `<h4>Bills</h4><div class="quick-list">${un.bills.map(x => (x.frequency === 'monthly' || x.frequency === 'semimonthly')
      ? `<label class="quick"><span>${esc(x.name)} <small class="muted">${money(num(x.amount), true)}</small></span><input type="number" min="1" max="31" inputmode="numeric" placeholder="day" data-quick="billDay" data-id="${x.id}"></label>`
      : `<label class="quick"><span>${esc(x.name)} <small class="muted">${PERIOD_LABEL[x.frequency].toLowerCase()}</small></span><input type="date" data-quick="billDate" data-id="${x.id}"></label>`).join('')}</div>`;
    if (un.goals.length) b += `<h4>Savings & IRA transfers</h4><div class="quick-list">${un.goals.map(x => `<label class="quick"><span>${esc(x.g.icon || '')} ${esc(x.g.name)} <small class="muted">${money(x.monthly)}/mo</small></span><input type="number" min="1" max="31" inputmode="numeric" placeholder="day" data-quick="goalDay" data-id="${x.g.id}"></label>`).join('')}</div>`;
    html += card(`Needs a date <span class="h-sub">${un.bills.length + un.goals.length + un.people.length}</span>`, b, { cls: 'wide' });
  }
  return html;
}

  return `<div class="tbl-scroll"><table class="tbl pay"><thead><tr><th></th>${cols.map(c => `<th class="r">${c[0]}</th>`).join('')}</tr></thead><tbody>

}
